<title>D12600</title>
<style>
  :root {

    display: flex; justify-content: space-between;

  .p .tag, .p .meta, .p .jp { color: #c9a227; }
  #panoPrev.on { background: var(--r); border-color: var(--r); color: #fff; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 0 0 auto; }

    flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px;

  }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; background: #2f3640; }
  input[type=range]::-webkit-slider-thumb {

    background: var(--r); margin-top: -10px; border: 0; border-radius: 50%;

  select {

  #files img, #pairs img { -webkit-user-drag: none; pointer-events: none; }

  .cam button.role { min-width: 48px; letter-spacing: 0.12em; }
  .cam button.role.on { color: #fff; }
  .cam.is-t button.role.on { background: var(--t); border-color: var(--t); }
  .cam.is-r button.role.on { background: var(--r); border-color: var(--r); }
  #log {
    flex: 0 0 auto; margin: 0; color: var(--dim); max-height: 2.6em;

    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #log.err { color: #ff3b3b; }
  .dlchk {
    display: flex; align-items: center; justify-content: flex-start; gap: 7px;
    color: var(--dim); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; min-height: 40px; white-space: nowrap;
  }
  .dlchk input {
    appearance: none; -webkit-appearance: none;
    width: 18px; height: 18px; margin: 0; border-radius: 4px;
    border: 1px solid var(--line); background: var(--btn);

  .dlchk:has(input:checked) { color: #fff; }
  .simpi { margin-left: 0; justify-content: flex-start; }

    background: var(--fire); border-color: var(--fire); color: #fff;
    font-size: 18px; letter-spacing: 0.16em; font-weight: 700; min-height: 72px;
    flex: 0 0 auto; position: relative; z-index: 6;
  }
  body.kiosk { cursor: none; }
  body.kiosk header a[href="/lab"] { display: none; }
  #kioskExit[hidden] { display: none !important; }
  .pair {

    border: 1px solid var(--line); border-radius: 8px; background: #0b0d10;
  }
  .pair-frames {
    display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 6px; align-items: start;
  }
  .pair-frames figure { margin: 0; }
  .pair-frames figcaption { color: var(--dim); font-size: 10px; letter-spacing: 0.12em; }
  .pair img { width: 100%; aspect-ratio: 3/2; object-fit: cover; background: #000; }
  .pair-pano img { aspect-ratio: 16/6; object-fit: contain; }

    flex: 1; min-width: 0; color: var(--dim);
    font: 12px/1.3 ui-monospace, Menlo, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pano-stat.run { color: var(--r); }
  .pano-stat.err { color: #ff3b3b; }
  .pair-stat {
    color: var(--dim); font: 12px/1.35 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; min-height: 1.4em;
  }
  .pair-stat b {
    display: inline-block; min-width: 4.6em; margin-right: 6px;
    letter-spacing: 0.08em;
  }
  .pair-stat.err { color: #ff3b3b; }
  .pair-stat.run, .pair-stat.queued { color: var(--r); }

  .pair.run, .pair.queued { border-color: var(--r); }

  .file {
    display: grid; gap: 8px; padding: 10px;

  .hud-cam b {

<script>
const ISO = ["Auto","100","125","160","200","250","320","400","500","640","800","1000","1250",
  "1600","2000","2500","3200","4000","5000","6400","12800","25600"];
const SHUT = ["Auto","30","20","15","10","8","6","4","3","2","1.6","1.3","1","0.8","0.6","0.5",
  "1/3","1/4","1/5","1/6","1/8","1/10","1/13","1/15","1/20","1/25","1/30","1/40","1/50",
  "1/60","1/80","1/100","1/125","1/160","1/200","1/250","1/320","1/400","1/500","1/640",
  "1/800","1/1000","1/1250","1/1600","1/2000","1/2500","1/3200","1/4000","1/5000","1/6400","1/8000"];
const FSTOP = ["Auto","1.4","1.8","2","2.2","2.5","2.8","3.2","3.5","4","4.5","5","5.6",
  "6.3","7.1","8","9","10","11","13","14","16","18","20","22"];
const WB = [["Auto","Auto"],["Sunny","Sunny"],["Cloudy","Cloudy"],["Flash","Flash"],
  ["Tungsten","Tungsten"],["Fluorescent","Fluor"],["Shade","Shade"]];
const QUAL = [["JPEG Fine","JPEG Fine"],["JPEG Normal","JPEG Norm"],
  ["NEF+Fine","NEF+Fine"],["NEF (Raw)","NEF"]];
const PROG = [["M","M"],["A","A"],["S","S"],["P","P"],["Auto","Auto"]];
const state = { iso:"400", shutter:"1/125", fstop:"5.6", wb:"Auto", quality:"JPEG Fine", program:"M",
  t:"", r:"", live:false, liveOk:false, panoPrev:false, timer:0, stamp:"", rows:[],
  previewS: 2,
  stats: { T: { on: false }, R: { on: false } } };
const log = (m, err) => { const el = document.getElementById("log");
  el.textContent = m; el.className = err ? "err" : ""; };
const api = async (path, opt) => {
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const isAuto = (val) => /^auto$/i.test(String(val || "").trim());
const idxOf = (list, val) => {
  const s = String(val || "").replace(/^ISO\s+/i, "").replace(/^f\/?/i, "").trim();
  return list.findIndex(v => v === s || v === val || v.toLowerCase() === s.toLowerCase());
};
const syncDrag = (id, list, key, label) => {
  const el = document.getElementById(id);
  if (!el) return;
  const i = idxOf(list, state[key]);
  if (i >= 0) el.value = String(i);
  const lab = document.getElementById(label);
  if (!lab) return;
  if (isAuto(state[key])) lab.textContent = "AUTO";
  else if (key === "fstop") lab.textContent = "f/" + String(state[key]).replace(/^f\/?/i, "");
  else lab.textContent = state[key];
};
const paintAuto = () => {
  [["isoAuto", "iso"], ["isoFastAuto", "iso"], ["shutAuto", "shutter"], ["shutFastAuto", "shutter"],
   ["fAuto", "fstop"], ["fFastAuto", "fstop"]].forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("on", isAuto(state[key]));
  });
};
const paintExposure = () => {
  syncDrag("isoDrag", ISO, "iso", "isoVal");
  syncDrag("isoFast", ISO, "iso", "isoFastVal");
  syncDrag("shutDrag", SHUT, "shutter", "shutVal");
  syncDrag("shutFast", SHUT, "shutter", "shutFastVal");
  syncDrag("fDrag", FSTOP, "fstop", "fVal");
  syncDrag("fFast", FSTOP, "fstop", "fFastVal");
  paintAuto();
};
const setAuto = (key) => {
  state[key] = "Auto";
  paintExposure();
};
const bindDrag = (id, list, key, applyFast) => {
  const el = document.getElementById(id);
  if (!el) return;
  el.max = String(list.length - 1);
  el.oninput = () => {
    let i = parseInt(el.value, 10);
    if (i < 0) i = 0;
    if (i >= list.length) i = list.length - 1;
    state[key] = list[i];
    paintExposure();
    if (applyFast) scheduleApply();
  };
};
const fillSelect = (id, items, key) => {
  const el = document.getElementById(id);
  el.innerHTML = "";
  const rows = items.slice();
  if (state[key] && !rows.some(item => item[0] === state[key])) {
    rows.push([state[key], state[key]]);
  }
  rows.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item[0]; opt.textContent = item[1];
    if (item[0] === state[key]) opt.selected = true;
    el.appendChild(opt);
  });
  el.onchange = () => { state[key] = el.value; };
};
const roleOf = (row) => {
  if (row.serial && row.serial === state.t) return "T";
  if (row.serial && row.serial === state.r) return "R";
  if (row.role === "T" || row.role === "R") return row.role;
  return "";
};
const batPct = (s) => {
  const raw = String(s || "").trim();
  const m = raw.match(/(\d+)\s*%/);
  if (m) return Math.min(100, parseInt(m[1], 10));
  if (/^\d{1,3}$/.test(raw)) return Math.min(100, parseInt(raw, 10));
  const named = { full: 100, high: 80, normal: 50, medium: 50, low: 20, empty: 5, critical: 8 };
  const k = raw.toLowerCase();
  for (const name of Object.keys(named)) if (k.includes(name)) return named[name];
  return null;
};
const shortQual = (s) => {
  s = String(s || "");
  if (!s || /USB busy|ptpcamerad|\?/.test(s)) return "";
  return s.replace(/^JPEG\s+/i, "").replace(/\s*\(Raw\)/i, "").replace(/^NEF\+.*/i, "NEF+");
};
const shortEv = (s) => {
  s = String(s || "").trim();
  if (!s || /USB busy|ptpcamerad|\?/.test(s)) return "";
  if (s === "0" || s === "0.0" || s === "+0" || s === "0 EV") return "";
  return /[+-]/.test(s) ? s : ((parseFloat(s) > 0 ? "+" : "") + s);
};
const paintHud = () => {
  ["T","R"].forEach(role => {
    const s = state.stats[role] || {};
    const el = document.getElementById("hud"+role);
    const autoFlag = /^on$/i.test(String(s.isoauto || "")) || /^on$/i.test(String(s.autoiso || ""));
    const isoNum = s.iso ? String(s.iso).replace(/^ISO\s+/i, "") : "";
    const iso = isAuto(s.iso) || (autoFlag && !/\d/.test(isoNum))
      ? "AUTO" : (isoNum || "—");
    const shut = s.shutterspeed || "—";
    const fnum = s["f-number"] ? String(s["f-number"]) : "";
    const mode = s.expprogram || "—";
    const wb = s.whitebalance || "—";
    const qual = shortQual(s.imagequality) || "—";
    const af = s.focusmode || s.focusmode2 || "";
    const ev = shortEv(s.exposurecompensation);
    const meter = s.meteringmode || "";
    const shots = String(s.availableshots || "").replace(/[^\d]/g, "");
    const bat = s.batterylevel || "";
    const pct = batPct(bat);
    const busy = bat && /USB busy|ptpcamerad|gphoto2/i.test(bat);
    el.classList.toggle("off", !s.on);
    el.classList.toggle("low", pct != null && pct <= 25 && s.on);
    el.querySelector(".hud-mode").textContent = s.on ? mode : "OUT";
    el.querySelector(".hud-iso").textContent = iso === "—" ? "ISO —" : iso === "AUTO" ? "ISO AUTO" : "ISO "+iso;
    el.querySelector(".hud-shut").textContent = fnum ? shut + "  " + fnum : shut;
    el.querySelector(".hud-wb").textContent = ev ? wb + "  " + ev : wb;
    el.querySelector(".hud-qual").textContent = qual;
    el.querySelector(".hud-af").textContent = [af, meter].filter(Boolean).join(" · ") || "—";
    el.querySelector(".hud-bat i").style.width = (pct == null ? 0 : pct) + "%";
    el.querySelector(".hud-pct").textContent = !s.on ? "OUT" : (busy ? "USB" : (bat || "USB"));
    el.querySelector(".hud-shots").textContent = shots && !busy && s.on ? shots : "";
    const st = document.getElementById("st"+role);
    if (st) st.textContent = s.on
      ? [mode !== "—" ? mode : "", iso !== "—" ? iso : "", shut !== "—" ? shut : "", bat].filter(Boolean).join(" · ") || "USB"
      : "USB OUT";
  });
};
const ingestHud = (rows, blocks) => {
  if (rows) {
    state.stats = { T: { on: false }, R: { on: false } };
    rows.forEach(row => {
      const role = roleOf(row);
      if (role) state.stats[role] = Object.assign({}, row, { role, on: true });
    });
  }
  (blocks || []).forEach(b => {
    let role = (b.role === "T" || b.role === "R") ? b.role : roleOf(b);
    if (!role && b.serialnumber) role = roleOf({ serial: b.serialnumber });
    if (role !== "T" && role !== "R") return;
    state.stats[role] = Object.assign({}, state.stats[role], b, { role, on: true });
  });
  paintHud();
};
const normShut = (s) => String(s || "").trim().replace(/\s+/g, "").replace(/s$/i, "").replace(/"$/, "");
const modeOwnsShutter = (m) => /^(M|S)$/i.test(String(m || "").trim());
const modeOwnsF = (m) => /^(M|A)$/i.test(String(m || "").trim());
const snapFromStatus = (b) => {
  if (b.iso && !isAuto(b.iso) && /\d/.test(String(b.iso)))
    state.iso = String(b.iso).replace(/^ISO\s+/i, "");
  else if (/^on$/i.test(String(b.isoauto || "")) || /^on$/i.test(String(b.autoiso || "")))
    state.iso = "Auto";
  else if (b.iso) state.iso = String(b.iso).replace(/^ISO\s+/i, "");
  if (b.shutterspeed && modeOwnsShutter(b.expprogram)) {
    const shut = normShut(b.shutterspeed);
    if (idxOf(SHUT, shut) >= 0) state.shutter = shut;
  } else if (b.expprogram && !modeOwnsShutter(b.expprogram)) {
    state.shutter = "Auto";
  }
  const fraw = b["f-number"] || b.aperture;
  if (fraw && modeOwnsF(b.expprogram)) {
    const f = String(fraw).replace(/^f\/?/i, "");
    if (idxOf(FSTOP, f) >= 0) state.fstop = f;
  } else if (b.expprogram && !modeOwnsF(b.expprogram)) {
    state.fstop = "Auto";
  }
  paintExposure();
  if (b.whitebalance) { state.wb = b.whitebalance; fillSelect("wb", WB, "wb"); }
  if (b.imagequality) { state.quality = b.imagequality; fillSelect("quality", QUAL, "quality"); }
  if (b.expprogram) { state.program = b.expprogram; fillSelect("program", PROG, "program"); }
};
const shortSerial = (s) => {
  s = String(s || "");
  return s.length > 4 ? s.slice(-4) : s;
};
const camBits = (row) => {
  const model = (row.model || "camera").replace(/^Nikon DSC /, "");
  const bits = [];
  if (row.serial) bits.push("#" + shortSerial(row.serial));
  if (row.port) bits.push(row.port);
  if (row.batterylevel) bits.push(row.batterylevel);
  else if (row.iso) bits.push("ISO " + row.iso);
  return { title: model, sub: bits.join(" · ") || "USB" };
};
const applyPair = (pair, swapped) => {
  if (swapped) {
    const t = state.stats.T, r = state.stats.R;
    state.stats.T = Object.assign({}, r, { role: "T" });
    state.stats.R = Object.assign({}, t, { role: "R" });
  }
  state.t = (pair && pair.T) || "";
  state.r = (pair && pair.R) || "";
  if (!state.t) state.stats.T = { on: false };
  if (!state.r) state.stats.R = { on: false };
  (state.rows || []).forEach(row => {
    row.role = row.serial && row.serial === state.t ? "T"
      : row.serial && row.serial === state.r ? "R" : "";
  });
  const sw = document.getElementById("swap");
  if (sw) sw.disabled = !state.t && !state.r;
  paintHud();
};
let pairing = false;
const paintCams = () => {
  const box = document.getElementById("cams");
  box.innerHTML = "";
  const seen = new Set();
  const addCard = (row, ghost) => {
    const serial = row.serial || "";
    if (serial) seen.add(serial);
    const who = serial && serial === state.t ? "T"
      : serial && serial === state.r ? "R"
      : (row.role || "");
    const info = camBits(row);
    const el = document.createElement("div");
    el.className = "cam" + (who === "T" ? " is-t" : who === "R" ? " is-r" : "") + (ghost ? " ghost" : "");
    const note = ghost ? " · offline" : serial ? "" : " · no serial · Detect again";
    el.innerHTML = `<div><b>${who ? who + "  " : ""}${info.title}</b><span>${info.sub}${note}</span></div>`;
    ["T","R"].forEach(role => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = role;
      b.className = "role" + (who === role ? " on" : "");
      b.disabled = !serial || pairing;
      b.onclick = () => assignRole(role, who === role ? "" : serial).catch(e => log(e.message, true));
      el.appendChild(b);
    });
    box.appendChild(el);
    if (who === "T" || who === "R") {
      const st = document.getElementById("st"+who);
      if (st) st.textContent = (row.batterylevel || row.iso || "USB");
    }
  };
  (state.rows || []).forEach(row => addCard(row, !row.port));
  [["T", state.t], ["R", state.r]].forEach(([role, serial]) => {
    if (serial && !seen.has(serial))
      addCard({ serial, role, model: "saved" }, true);
  });
  if (!(state.rows || []).length && !state.t && !state.r) {
    box.innerHTML = "<div class='cam'><div><b>NO BODIES</b><span>MTP/PTP · wake · plug USB</span></div></div>";
  }
};
const fill = (rows, pair) => {
  state.rows = rows || [];
  if (pair) applyPair(pair);
  else (rows || []).forEach(row => {
    if (row.role === "T" && row.serial) state.t = row.serial;
    if (row.role === "R" && row.serial) state.r = row.serial;
  });
  paintCams();
  ingestHud(rows);
};
const assignRole = async (role, serial) => {
  if (pairing) return;
  pairing = true;
  paintCams();
  try {
    const body = role === "T" ? { t: serial } : { r: serial };
    const j = await api("/api/pair", { method:"POST",
      headers:{"content-type":"application/json"},
      body: JSON.stringify(body) });
    applyPair(j.pair);
    ingestHud(state.rows);
    paintCams();
    log(j.message);
    refreshStatus();
  } finally { pairing = false; paintCams(); }
};
const refreshStatus = () => {
  api("/api/status").then(j => {
    fill(j.cameras, j.pair);
    ingestHud(j.cameras, j.status);
    (j.status || []).forEach(b => {
      if (b.role === "T" || b.role === "R") snapFromStatus(b);
    });
    log(j.message);
  }).catch(e => log(e.message, true));
};
const bind = (id, fn) => {
  document.getElementById(id).onclick = async () => {
    const b = document.getElementById(id);
    b.disabled = true;
    try { await fn(); } catch (e) { log(e.message, true); }
    b.disabled = false;
  };
};
const bindPaneScroll = (el) => {
  if (!el) return;
  let y0 = 0, top0 = 0, on = false, moved = 0;
  const onCtrl = (t) => t && t.closest && t.closest("button, a, input, select, label, textarea");
  el.addEventListener("pointerdown", (ev) => {
    if (ev.button || onCtrl(ev.target)) return;
    on = true;
    moved = 0;
    y0 = ev.clientY;
    top0 = el.scrollTop;
    el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener("pointermove", (ev) => {
    if (!on) return;
    const dy = ev.clientY - y0;
    if (Math.abs(dy) < 6 && moved < 6) return;
    moved = Math.max(moved, Math.abs(dy));
    el.scrollTop = top0 - dy;
    ev.preventDefault();
  });
  const end = () => { on = false; };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("click", (ev) => {
    if (moved < 6 || onCtrl(ev.target)) { moved = 0; return; }
    ev.preventDefault();
    ev.stopPropagation();
    moved = 0;
  }, true);
};
["files", "pairs", "cams", "tab-set"].forEach((id) =>
  bindPaneScroll(document.getElementById(id)));

const liveOverlap = () => {
  const el = document.getElementById("olDrag");
  const n = el ? parseInt(el.value, 10) : 20;

const composePano = () => {
  if (!state.panoPrev) return;
  const t = document.getElementById("lvT");
  const r = document.getElementById("lvR");
  const canvas = document.getElementById("lvP");
  if (!canvas || !t.naturalWidth || !r.naturalWidth) return;
  const flip = flopOn();
  const ol = liveOverlap();
  const h = Math.min(t.naturalHeight, r.naturalHeight);
  const tw = Math.round(t.naturalWidth * h / t.naturalHeight);
  const rw = Math.round(r.naturalWidth * h / r.naturalHeight);
  const olPx = Math.max(8, Math.round(tw * ol));
  const seam = Math.max(1, tw - olPx);
  const width = seam + rw;
  if (canvas.width !== width || canvas.height !== h) {
    canvas.width = width;
    canvas.height = h;
  }
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, width, h);
  ctx.drawImage(t, 0, 0, t.naturalWidth, t.naturalHeight, 0, 0, tw, h);
  const tmp = document.createElement("canvas");
  tmp.width = rw;
  tmp.height = h;
  const tx = tmp.getContext("2d");
  tx.save();
  if (flip) {
    tx.translate(rw, 0);
    tx.scale(-1, 1);
  }
  tx.drawImage(r, 0, 0, r.naturalWidth, r.naturalHeight, 0, 0, rw, h);
  tx.restore();
  const fade = tx.createLinearGradient(0, 0, olPx, 0);
  fade.addColorStop(0, "rgba(0,0,0,0)");
  fade.addColorStop(0.55, "rgba(0,0,0,1)");
  fade.addColorStop(1, "rgba(0,0,0,1)");
  tx.globalCompositeOperation = "destination-in";
  tx.fillStyle = fade;
  tx.fillRect(0, 0, rw, h);
  ctx.drawImage(tmp, seam, 0);
  const jp = document.querySelector("#panoPrevFig .jp");
  if (jp) jp.textContent = Math.round(ol * 100) + "%" + (flip ? " flop" : "");
  const st = document.getElementById("stP");
  if (st) st.textContent = "blend";
};

const stitchKind = (p) => {
  const s = p.stitch || {};
  if (s.phase === "queued" || (s.running && /^queued/.test(s.message || ""))) return "queued";
  if (s.running || s.phase === "start" || s.phase === "work") return "run";
  if (s.error || s.phase === "error") return "err";
  if (s.phase === "done" || s.message || p.pano) return "ok";
  return "";
};
const stitchLine = (p) => {
  const s = p.stitch || {};
  const lines = Array.isArray(s.log) ? s.log : [];
  const kind = stitchKind(p);
  if (kind === "queued") return s.message || "queued…";
  if (kind === "run")
    return (lines.length ? lines.slice(-4).join("\n") : (s.message || "stitching…"));
  if (kind === "err") return s.error || s.message || "failed";
  if (s.message) return s.message;
  if (p.pano) return "stitched  " + p.pano;
  return p.ready ? "ready  pick a mode, then STITCH" : "need T and R";
};
const paintPairStat = (el, p) => {

  el.innerHTML = "<b>" + tag + "</b>" + stitchLine(p);
  el.className = "pair-stat" + (kind ? " " + kind : "");
  const card = el.closest(".pair");
  if (card) card.className = "pair" + (kind ? " " + kind : "");
};

const exifBits = (e) => {
  if (!e) return "";
  const iso = e.iso ? (/^auto$/i.test(e.iso) ? "ISO AUTO" : "ISO "+e.iso) : "";
  const f = e.f ? "f/"+e.f : "";
  const ev = e.ec || "";
  return [e.program, iso, e.shutter, f, e.wb, ev].filter(Boolean).join(" · ");
};
const exifBlock = (exif) => {

    return bits ? `<div class="exif"><span class="${role.toLowerCase()}">${role}</span>  ${bits}${exif[role].taken ? "  "+exif[role].taken : ""}</div>` : "";
  });

    b.className = "osk-key" + (cls ? " " + cls : "");
    b.textContent = label;
    b.addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      fn(b);
    });
    return b;
  };
  const paintKeys = () => {
    rows.forEach((row) => { row.innerHTML = ""; });
    const ch = (c) => (shift && !sym ? c.toUpperCase() : c);
    const row0 = letters.slice(0, 10).map((c) =>
      keyBtn(ch(c), "", () => insert(ch(c))));
    rows[0].append(...row0);
    const row1 = letters.slice(10, 20).map((c) =>
      keyBtn(ch(c), "", () => insert(ch(c))));
    rows[1].append(...row1);
    const row2 = letters.slice(20, 29).map((c) =>
      keyBtn(ch(c), "", () => insert(ch(c))));
    rows[2].append(...row2);
    const row3 = letters.slice(29).map((c) =>
      keyBtn(ch(c), "", () => insert(ch(c))));
    const shiftBtn = keyBtn("SHIFT", shift ? "on" : "wide", () => {
      shift = !shift;
      paintKeys();
    });
    shiftBtn.classList.add("wide");
    rows[3].append(shiftBtn, ...row3);
    if (sym) {
      rows[4].append(
        keyBtn("ABC", "wide", () => { sym = false; paintKeys(); }),
        ...symbols.split("").map((c) => keyBtn(c, "", () => insert(c))),
        keyBtn("⌫", "wide", backspace),
        keyBtn("DONE", "wide", hide),
      );
    } else {
      rows[4].append(
        keyBtn("SYM", "wide", () => { sym = true; paintKeys(); }),
        keyBtn("SPACE", "wide", () => insert(" ")),
        keyBtn("⌫", "wide", backspace),
        keyBtn(peek ? "HIDE" : "SHOW", "wide", () => {
          if (!target) return;
          peek = !peek;
          target.type = peek ? "text" : "password";
          paintKeys();
        }),
        keyBtn("JOIN", "wide enter", () => {
          if (target && target.id === "wifiPsk") joinWifi(target.value);
          else hide();
        }),
        keyBtn("DONE", "wide", hide),
      );
    }
  };
  const insert = (text) => {
    if (!target) return;
    const start = target.selectionStart ?? target.value.length;
    const end = target.selectionEnd ?? start;
    const val = target.value;
    target.value = val.slice(0, start) + text + val.slice(end);
    const pos = start + text.length;
    target.setSelectionRange(pos, pos);
    target.dispatchEvent(new Event("input", { bubbles: true }));
  };
  const backspace = () => {
    if (!target) return;
    const start = target.selectionStart ?? target.value.length;
    const end = target.selectionEnd ?? start;
    if (start !== end) {
      target.value = target.value.slice(0, start) + target.value.slice(end);
      target.setSelectionRange(start, start);
    } else if (start > 0) {
      target.value = target.value.slice(0, start - 1) + target.value.slice(start);
      target.setSelectionRange(start - 1, start - 1);
    }
    target.dispatchEvent(new Event("input", { bubbles: true }));
  };
  const show = (input) => {
    if (!oskTouch() || !input) return;
    target = input;
    peek = false;
    if (input.type === "password") input.type = "password";
    input.readOnly = true;
    panel.hidden = false;
    panel.setAttribute("aria-hidden", "false");
    document.body.classList.add("osk-open");
    paintKeys();
    window.setTimeout(() => {
      input.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }, 30);
  };
  const hide = () => {
    window.clearTimeout(hideTimer);
    if (target) {
      target.readOnly = false;
      if (target.id === "wifiPsk") target.type = "password";
      target.blur();
      target = null;
    }
    peek = false;
    shift = false;
    sym = false;
    panel.hidden = true;
    panel.setAttribute("aria-hidden", "true");
    document.body.classList.remove("osk-open");
  };
  panel.addEventListener("pointerdown", (ev) => ev.preventDefault());
  const bind = (input) => {
    input.addEventListener("focus", () => show(input));
    input.addEventListener("blur", () => {
      window.clearTimeout(hideTimer);
      hideTimer = window.setTimeout(() => {
        if (document.activeElement !== input && !panel.contains(document.activeElement))
          hide();
      }, 120);
    });
  };
  paintKeys();
  return { bind, hide, show };
})();
