<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DUALS">
<meta name="theme-color" content="#070708">
<title>DUALS</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070708;
    --ink: #f2efe6;
    --dim: #8a8578;
    --line: #2a281f;
    --t: #e8a317;
    --r: #3ecfcf;
    --fire: #d41818;
    --ok: #9adf4a;
    --pad: max(14px, env(safe-area-inset-left));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", ui-sans-serif, sans-serif;
    padding: env(safe-area-inset-top) var(--pad) 0;
    padding-bottom: calc(118px + env(safe-area-inset-bottom));
    touch-action: manipulation;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 10px 0 12px; border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0; font-size: 13px; letter-spacing: 0.28em; font-weight: 700;
  }
  header a { color: var(--dim); font-size: 12px; text-decoration: none; }
  #host { color: var(--t); font-size: 12px; letter-spacing: 0.04em; }
  .previews {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0 10px;
  }
  figure { margin: 0; position: relative; background: #000; }
  figure img { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; background: #000; }
  figure .tag {
    position: absolute; top: 6px; left: 7px; font: 700 22px/1 "SF Pro Display", ui-sans-serif;
    letter-spacing: 0.06em; text-shadow: 0 1px 4px #000;
  }
  figure .meta {
    position: absolute; left: 7px; bottom: 6px; right: 7px;
    font-size: 11px; color: #ddd; text-shadow: 0 1px 3px #000;
    display: flex; justify-content: space-between;
  }
  .t .tag, .t .meta { color: var(--t); }
  .r .tag, .r .meta { color: var(--r); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  button, .chip {
    appearance: none; border: 1px solid var(--line); background: #121212; color: var(--ink);
    font: 600 15px/1.1 inherit; min-height: 44px; padding: 0 14px; border-radius: 2px;
  }
  button:active, .chip.on { background: #1c1a12; border-color: var(--t); color: var(--t); }
  button:disabled { opacity: 0.45; }
  .chip { min-width: 52px; text-align: center; }
  .lbl { width: 100%; color: var(--dim); font-size: 11px; letter-spacing: 0.16em;
         text-transform: uppercase; margin: 12px 0 4px; }
  .drag { margin: 10px 0 4px; }
  .drag .k {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--dim); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .drag .k b { color: var(--t); font-size: 22px; letter-spacing: 0.02em; font-weight: 700; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 44px;
    background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; background: #2a281f; border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--t); margin-top: -12px; border: 0;
  }
  .picks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 10px 0; }
  .picks label { display: flex; flex-direction: column; gap: 5px; color: var(--dim);
                 font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
  select {
    font: 16px/1.2 inherit; min-height: 44px; padding: 0 10px;
    background: #121212; color: var(--ink); border: 1px solid var(--line); border-radius: 2px;
  }
  #cams { display: grid; gap: 8px; }
  .cam {
    border: 1px solid var(--line); padding: 10px 12px;
    display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
  }
  .cam b { font-size: 13px; letter-spacing: 0.04em; }
  .cam span { display: block; color: var(--dim); font-size: 12px; }
  #log {
    margin: 10px 0 0; color: var(--ok); font: 12px/1.4 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; min-height: 2.6em;
  }
  #log.err { color: #ff6b6b; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, #070708 28%);
    display: grid; grid-template-columns: 1fr 92px; gap: 8px;
  }
  #shoot {
    background: var(--fire); border-color: #ff3b3b; color: #fff;
    font-size: 20px; letter-spacing: 0.18em; font-weight: 800; min-height: 64px;
  }
  #dl { font-size: 13px; letter-spacing: 0.08em; color: var(--dim); }
  @media (orientation: landscape) and (max-height: 500px) {
    body { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
    #shoot { min-height: 52px; }
  }
</style>
<header>
  <h1>DUALS</h1>
  <span id="host"></span>
  <a href="/lab">lab</a>
</header>
<div class="previews">
  <figure class="t">
    <img id="lvT" alt="T">
    <div class="tag">T</div>
    <div class="meta"><span>BACK +Y</span><span id="stT">—</span></div>
  </figure>
  <figure class="r">
    <img id="lvR" alt="R">
    <div class="tag">R</div>
    <div class="meta"><span>SIDE +X</span><span id="stR">—</span></div>
  </figure>
</div>
<div class="row">
  <button id="live">LIVE</button>
  <button id="liveStop">STOP</button>
  <button id="detect">DETECT</button>
  <button id="status">STATUS</button>
</div>
<div class="drag">
  <div class="k">ISO <b id="isoVal">400</b></div>
  <input type="range" id="isoDrag" min="0" step="1">
</div>
<div class="drag">
  <div class="k">Shutter <b id="shutVal">1/125</b></div>
  <input type="range" id="shutDrag" min="0" step="1">
</div>
<div class="picks">
  <label>Program
    <select id="program"></select>
  </label>
  <label>WB
    <select id="wb"></select>
  </label>
  <label>Quality
    <select id="quality"></select>
  </label>
</div>
<div class="row"><button id="set">SET BOTH</button></div>
<div class="lbl">Bodies · tap T / R</div>
<div id="cams"></div>
<pre id="log">Wake both bodies · USB MTP/PTP · same Wi‑Fi as this phone</pre>
<footer>
  <button id="shoot">FIRE</button>
  <button id="dl">SAVE</button>
</footer>
<script>
const ISO = ["100","125","160","200","250","320","400","500","640","800","1000","1250",
  "1600","2000","2500","3200","4000","5000","6400","12800","25600"];
const SHUT = ["30","20","15","10","8","6","4","3","2","1.6","1.3","1","0.8","0.6","0.5",
  "1/3","1/4","1/5","1/6","1/8","1/10","1/13","1/15","1/20","1/25","1/30","1/40","1/50",
  "1/60","1/80","1/100","1/125","1/160","1/200","1/250","1/320","1/400","1/500","1/640",
  "1/800","1/1000","1/1250","1/1600","1/2000","1/2500","1/3200","1/4000","1/5000","1/6400","1/8000"];
const WB = [["Auto","Auto"],["Sunny","Sunny"],["Cloudy","Cloudy"],["Flash","Flash"],
  ["Tungsten","Tungsten"],["Fluorescent","Fluor"],["Shade","Shade"]];
const QUAL = [["JPEG Fine","JPEG Fine"],["JPEG Normal","JPEG Norm"],
  ["NEF+Fine","NEF+Fine"],["NEF (Raw)","NEF"]];
const PROG = [["M","M"],["A","A"],["S","S"],["P","P"]];
const state = { iso:"400", shutter:"1/125", wb:"Auto", quality:"JPEG Fine", program:"M",
  t:"", r:"", live:false, timer:0 };
const log = (m, err) => { const el = document.getElementById("log");
  el.textContent = m; el.className = err ? "err" : ""; };
const api = async (path, opt) => {
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const idxOf = (list, val) => {
  const s = String(val || "").replace(/^ISO\s+/i, "").trim();
  const i = list.findIndex(v => v === s || v === val);
  return i < 0 ? 0 : i;
};
const bindDrag = (id, list, key, label) => {
  const el = document.getElementById(id);
  el.max = String(list.length - 1);
  const paint = () => {
    let i = parseInt(el.value, 10);
    if (i < 0) i = 0;
    if (i >= list.length) i = list.length - 1;
    state[key] = list[i];
    document.getElementById(label).textContent = list[i];
  };
  el.oninput = paint;
  el.value = String(idxOf(list, state[key]));
  paint();
};
const fillSelect = (id, items, key) => {
  const el = document.getElementById(id);
  el.innerHTML = "";
  items.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item[0]; opt.textContent = item[1];
    if (item[0] === state[key]) opt.selected = true;
    el.appendChild(opt);
  });
  el.onchange = () => { state[key] = el.value; };
};
const snapFromStatus = (b) => {
  if (b.iso) { state.iso = String(b.iso).replace(/^ISO\s+/i, ""); bindDrag("isoDrag", ISO, "iso", "isoVal"); }
  if (b.shutterspeed) { state.shutter = String(b.shutterspeed); bindDrag("shutDrag", SHUT, "shutter", "shutVal"); }
  if (b.whitebalance) { state.wb = b.whitebalance; fillSelect("wb", WB, "wb"); }
  if (b.imagequality) { state.quality = b.imagequality; fillSelect("quality", QUAL, "quality"); }
  if (b.expprogram) { state.program = b.expprogram; fillSelect("program", PROG, "program"); }
};
const fill = (rows, pair) => {
  pair = pair || {};
  if (pair.T) state.t = pair.T;
  if (pair.R) state.r = pair.R;
  const box = document.getElementById("cams");
  box.innerHTML = "";
  (rows || []).forEach(row => {
    if (row.role === "T" && row.serial) state.t = row.serial;
    if (row.role === "R" && row.serial) state.r = row.serial;
    const el = document.createElement("div");
    el.className = "cam";
    const who = (row.serial && row.serial === state.t) ? "T"
      : (row.serial && row.serial === state.r) ? "R"
      : (row.role || "—");
    el.innerHTML = `<div><b>${who}  ${row.model || "camera"}</b>
      <span>${row.serial || "no serial"}  ${row.port || ""}</span></div>`;
    ["T","R"].forEach(role => {
      const b = document.createElement("button");
      b.className = "chip" + (row.serial && state[role.toLowerCase()] === row.serial ? " on" : "");
      b.textContent = role;
      b.onclick = async () => {
        state[role.toLowerCase()] = row.serial || "";
        if (state.t && state.r) {
          const j = await api("/api/pair", { method:"POST",
            headers:{"content-type":"application/json"},
            body: JSON.stringify({ t: state.t, r: state.r }) });
          log(j.message);
        }
        fill(rows, { T: state.t, R: state.r });
      };
      el.appendChild(b);
    });
    box.appendChild(el);
    const st = document.getElementById("st"+who);
    if (st) st.textContent = (row.batterylevel || row.iso || "USB");
  });
  if (!(rows || []).length) {
    box.innerHTML = "<div class='cam'><div><b>NO BODIES</b><span>MTP/PTP · wake · plug USB</span></div></div>";
  }
};
const bind = (id, fn) => {
  document.getElementById(id).onclick = async () => {
    const b = document.getElementById(id);
    b.disabled = true;
    try { await fn(); } catch (e) { log(e.message, true); }
    b.disabled = false;
  };
};
const setLiveSrc = (on) => {
  state.live = on;
  if (state.timer) { clearTimeout(state.timer); state.timer = 0; }
  if (!on) {
    ["T","R"].forEach(role => { document.getElementById("lv"+role).src = ""; });
    return;
  }
  const tick = async () => {
    if (!state.live) return;
    for (const role of ["T","R"]) {
      try {
        const r = await fetch("/api/live/"+role+".jpg", { cache:"no-store" });
        if (r.ok && (r.headers.get("content-type") || "").includes("jpeg")) {
          const url = URL.createObjectURL(await r.blob());
          const img = document.getElementById("lv"+role);
          const old = img.src;
          img.src = url;
          if (old.startsWith("blob:")) URL.revokeObjectURL(old);
        }
      } catch (e) {}
    }
    state.timer = setTimeout(tick, 280);
  };
  tick();
};
const usb = async (fn) => {
  const was = state.live;
  setLiveSrc(false);
  try { return await fn(); }
  finally { if (was) {
    try { await api("/api/live/start", { method:"POST" }); setLiveSrc(true); }
    catch (e) { log(e.message, true); }
  } }
};
bind("detect", async () => {
  const was = state.live; setLiveSrc(false);
  const j = await api("/api/detect"); fill(j.cameras, j.pair); log(j.message);
  if (was) { await api("/api/live/start", { method:"POST" }); setLiveSrc(true); }
});
bind("status", async () => { await usb(async () => {
  const j = await api("/api/status"); fill(j.cameras, j.pair); log(j.message);
  (j.status || []).forEach(b => {
    const el = document.getElementById("st"+(b.role || ""));
    if (el) el.textContent = [b.iso, b.shutterspeed, b.batterylevel].filter(Boolean).join(" · ");
    if (b.role === "T" || b.role === "R") snapFromStatus(b);
  });
}); });
bind("set", async () => { await usb(async () => {
  const j = await api("/api/set", { method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({ iso: state.iso, shutter: state.shutter,
      program: state.program, wb: state.wb, quality: state.quality }) });
  log(j.message);
}); });
const fire = (target) => usb(async () => {
  const j = await api("/api/shoot", { method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({ target }) });
  log(j.message);
});
bind("shoot", () => fire("card"));
bind("dl", () => fire("download"));
bind("live", async () => {
  const j = await api("/api/live/start", { method:"POST" });
  setLiveSrc(true); log(j.message);
});
bind("liveStop", async () => {
  setLiveSrc(false);
  const j = await api("/api/live/stop", { method:"POST" }); log(j.message);
});
bindDrag("isoDrag", ISO, "iso", "isoVal");
bindDrag("shutDrag", SHUT, "shutter", "shutVal");
fillSelect("program", PROG, "program");
fillSelect("wb", WB, "wb");
fillSelect("quality", QUAL, "quality");
if (navigator.wakeLock) {
  const lock = () => navigator.wakeLock.request("screen").catch(() => {});
  lock(); document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") lock();
  });
}
api("/api/meta").then(j => {
  document.getElementById("host").textContent = (j.phone || "").replace("http://","");
}).catch(() => {});
api("/api/detect").then(j => { fill(j.cameras, j.pair); log(j.message); })
  .catch(e => log(e.message, true));
</script>
