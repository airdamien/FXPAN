<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="D12600">
<meta name="theme-color" content="#0b0b0c">
<title>D12600</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101214;
    --ink: #e8eaed;
    --dim: #8b939e;
    --line: #2f3640;
    --t: #9a5cff;
    --r: #c45c26;
    --fire: #b42318;
    --ok: #6cff4d;
    --btn: #1c2128;
    --side: 168px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.25 "DejaVu Sans", Futura, "Hiragino Sans", system-ui, sans-serif;
    touch-action: manipulation;
    overflow: hidden;
  }
  body.live .pulse { color: var(--ok); }
  .app { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px 6px 12px;
    border-bottom: 1px solid var(--line);
    min-height: 48px;
  }
  .brand {
    flex: 0 0 auto; font: 700 18px/1 "DejaVu Sans", sans-serif;
    letter-spacing: 0.08em; color: #f2f4f8;
  }
  header a { color: var(--r); font-size: 12px; letter-spacing: 0.12em; text-decoration: none; }
  #host, .pulse { color: var(--dim); font-size: 12px; letter-spacing: 0.06em; white-space: nowrap; }
  .pulse { min-width: 4.5em; text-align: right; }
  .main { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 8px 10px 8px 10px; }
  .stage { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .side {
    flex: 0 0 var(--side); min-width: var(--side);
    display: flex; flex-direction: column; gap: 8px;
    position: relative;
  }
  #exp.on { background: var(--r); border-color: var(--r); color: #fff; }
  #expModal {
    position: absolute; inset: 0; z-index: 5;
    background: #101214; border-radius: 8px;
    display: flex; flex-direction: column; gap: 8px; padding: 8px 4px;
  }
  #expModal[hidden] { display: none !important; }
  .vsliders {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  }
  .vdrag {
    display: flex; flex-direction: column; align-items: center;
    min-height: 0; gap: 4px;
  }
  .vdrag b {
    color: var(--r); font-size: 15px; font-weight: 700; letter-spacing: 0.02em;
    text-align: center; line-height: 1.15; min-height: 2.2em;
    display: flex; align-items: center; justify-content: center;
  }
  .vdrag span { color: var(--dim); font-size: 10px; letter-spacing: 0.12em; }
  .vdrag .slot {
    flex: 1; min-height: 0; width: 100%; position: relative;
  }
  input[type=range].vert {
    -webkit-appearance: none; appearance: none;
    position: absolute; top: 50%; left: 50%;
    width: var(--vh, 240px); height: 44px; margin: 0;
    transform: translate(-50%, -50%) rotate(-90deg);
    background: transparent;
  }
  input[type=range].vert::-webkit-slider-runnable-track {
    height: 3px; background: #2f3640;
  }
  input[type=range].vert::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px;
    background: var(--r); margin-top: -10px; border: 0; border-radius: 50%;
  }
  #expDone { width: 100%; min-height: 48px; }
  .tabs { display: flex; flex-direction: column; gap: 8px; }
  .side button { width: 100%; }
  .tabs button.on { background: var(--r); border-color: var(--r); color: #fff; }
  .side-fill { flex: 1; min-height: 0; }
  .pane {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
  }
  .pane[hidden] { display: none !important; }
  .previews {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr);
    gap: 8px;
  }
  .previews.pano-on { grid-template-rows: minmax(0, 1fr) minmax(72px, 32%); }
  .previews figure {
    margin: 0; position: relative; background: #0b0d10; min-height: 0; overflow: hidden;
    outline: 1px solid var(--line);
  }
  .previews figure.t { outline-color: var(--t); }
  .previews figure.r { outline-color: var(--r); }
  .previews figure.p {
    grid-column: 1 / -1; outline-color: #c9a227;
  }
  .previews figure.p[hidden] { display: none !important; }
  .previews figure img, .previews figure canvas {
    width: 100%; height: 100%; object-fit: contain; display: block; background: #0b0d10;
  }
  .previews figure.t::after, .previews figure.r::after {
    content: ""; pointer-events: none; position: absolute; inset: 0;
    background:
      linear-gradient(transparent 49.4%, rgba(196,92,38,.45) 49.4% 50.6%, transparent 50.6%),
      linear-gradient(90deg, transparent 49.4%, rgba(196,92,38,.45) 49.4% 50.6%, transparent 50.6%);
  }
  .previews .tag {
    position: absolute; top: 6px; left: 8px; z-index: 1;
    font: 800 20px/1 sans-serif; letter-spacing: 0.08em;
    text-shadow: 0 0 8px currentColor;
  }
  .previews .jp {
    position: absolute; top: 8px; right: 8px; z-index: 1;
    font-size: 10px; letter-spacing: 0.18em; opacity: 0.85;
  }
  .previews .meta {
    position: absolute; left: 7px; bottom: 7px; right: 7px; z-index: 1;
    font-size: 10px; letter-spacing: 0.12em; text-shadow: 0 1px 3px #000;
    display: flex; justify-content: space-between;
  }
  .t .tag, .t .meta, .t .jp { color: var(--t); }
  .r .tag, .r .meta, .r .jp { color: var(--r); }
  .p .tag, .p .meta, .p .jp { color: #c9a227; }
  #panoPrev.on { background: var(--r); border-color: var(--r); color: #fff; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 0 0 auto; }
  .livebar { display: flex; flex-direction: column; gap: 8px; }
  .livebar[hidden] { display: none !important; }
  button, .chip {
    appearance: none; border: 1px solid var(--line); background: var(--btn); color: var(--ink);
    font: 700 15px/1.1 "DejaVu Sans", sans-serif; letter-spacing: 0.08em;
    min-height: 44px; padding: 0 12px; border-radius: 8px;
  }
  button:active, .chip.on { background: #3a414c; }
  button:disabled { opacity: 0.4; }
  .chip { min-width: 52px; text-align: center; }
  .lbl { width: 100%; color: var(--dim); font-size: 11px; letter-spacing: 0.14em;
         text-transform: uppercase; margin: 0; flex: 0 0 auto; }
  .drag { margin: 0; flex: 0 0 auto; }
  .drag .k {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--dim); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .drag .k b { color: var(--r); font-size: 22px; letter-spacing: 0.04em; font-weight: 700; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 40px;
    background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; background: #2f3640; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px;
    background: var(--r); margin-top: -10px; border: 0; border-radius: 50%;
  }
  .picks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex: 0 0 auto; }
  .picks label { display: flex; flex-direction: column; gap: 5px; color: var(--dim);
                 font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
  select {
    font: 16px/1.2 inherit; min-height: 44px; padding: 0 10px; border-radius: 8px;
    background: var(--btn); color: var(--ink); border: 1px solid var(--line);
  }
  #cams, #pairs, #files {
    flex: 1; min-height: 0; overflow: auto; display: grid; gap: 8px; align-content: start;
  }
  .cam {
    border: 1px solid var(--line); padding: 10px 12px; border-radius: 8px;
    display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
    background: #0b0d10;
  }
  .cam.is-t { border-color: var(--t); }
  .cam.is-r { border-color: var(--r); }
  .cam.ghost { opacity: 0.55; }
  .cam b { font-size: 13px; letter-spacing: 0.08em; }
  .cam span { display: block; color: var(--dim); font-size: 12px; }
  .cam button.role { min-width: 48px; letter-spacing: 0.12em; }
  .cam button.role.on { color: #fff; }
  .cam.is-t button.role.on { background: var(--t); border-color: var(--t); }
  .cam.is-r button.role.on { background: var(--r); border-color: var(--r); }
  #log {
    flex: 0 0 auto; margin: 0; color: var(--dim); max-height: 2.6em;
    font: 13px/1.3 ui-monospace, "DejaVu Sans Mono", Menlo, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #log.err { color: #ff3b3b; }
  .dlchk {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    color: var(--dim); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; min-height: 40px; white-space: nowrap;
  }
  .dlchk input {
    appearance: none; -webkit-appearance: none;
    width: 18px; height: 18px; margin: 0; border-radius: 4px;
    border: 1px solid var(--line); background: var(--btn);
  }
  .dlchk input:checked { background: var(--r); border-color: var(--r); }
  .dlchk:has(input:checked) { color: #fff; }
  .simpi { margin-left: 0; justify-content: flex-start; }
  #shoot {
    background: var(--fire); border-color: var(--fire); color: #fff;
    font-size: 18px; letter-spacing: 0.16em; font-weight: 700; min-height: 72px;
  }
  body.kiosk { cursor: none; }
  body.kiosk header a[href="/lab"] { display: none; }
  #kioskExit[hidden] { display: none !important; }
  .pair {
    display: grid; gap: 6px; width: 100%; padding: 8px; text-align: left;
    border: 1px solid var(--line); border-radius: 8px; background: #0b0d10;
  }
  .pair-frames {
    display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 6px; align-items: start;
  }
  .pair-frames figure { margin: 0; }
  .pair-frames figcaption { color: var(--dim); font-size: 10px; letter-spacing: 0.12em; }
  .pair img { width: 100%; aspect-ratio: 3/2; object-fit: cover; background: #000; }
  .pair-pano img { aspect-ratio: 16/6; object-fit: contain; }
  .pair-stat {
    color: var(--ok); font: 12px/1.35 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; min-height: 1.4em;
  }
  .pair-stat.err { color: #ff3b3b; }
  .pair-stat.run { color: var(--r); }
  .pair-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pair-acts .who { color: var(--dim); font-size: 11px; letter-spacing: 0.1em; }
  .file {
    display: grid; gap: 8px; padding: 10px;
    border: 1px solid var(--line); border-radius: 8px; background: #0b0d10;
  }
  .file .thumbs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .file img { width: 100%; aspect-ratio: 3/2; object-fit: cover; background: #000; }
  .file .who { color: var(--dim); font-size: 10px; letter-spacing: 0.14em; }
  .file .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .hud {
    flex: 1; min-width: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .hud-cam {
    display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .hud-cam b {
    font: 800 18px/1 sans-serif; letter-spacing: 0.06em; min-width: 1.05em;
  }
  .hud-cam.t b { color: var(--t); }
  .hud-cam.r b { color: var(--r); }
  .hud-mid { flex: 1; min-width: 0; }
  .hud-line {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 13px; letter-spacing: 0.04em;
  }
  .hud-sub { display: none; }
  .hud-pwr { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .hud-ico {
    flex: 0 0 auto; width: 14px; height: 8px; box-sizing: border-box;
    border: 1px solid currentColor; color: var(--dim); position: relative;
  }
  .hud-ico::after {
    content: ""; position: absolute; right: -3px; top: 1px;
    width: 2px; height: 4px; background: currentColor;
  }
  .hud-bat { flex: 1; min-width: 0; height: 5px; background: #2a2f36; overflow: hidden; }
  .hud-bat i { display: block; height: 100%; width: 0; background: var(--ok); }
  .hud-pct { color: var(--dim); font-size: 11px; letter-spacing: 0.06em; white-space: nowrap; }
  .hud-shots { color: var(--dim); font-size: 10px; letter-spacing: 0.06em; white-space: nowrap; }
  .hud-shots:empty { display: none; }
  .hud-cam.low .hud-bat i { background: var(--fire); }
  .hud-cam.low .hud-ico, .hud-cam.low .hud-pct { color: var(--fire); }
  .hud-cam.off { opacity: 0.35; }
  @media (max-width: 720px) {
    html, body { height: auto; min-height: 100%; overflow: auto; }
    .app { min-height: 100dvh; height: auto; }
    .main { flex-direction: column; }
    .stage { min-height: 52vh; }
    .previews { min-height: 220px; }
    .side { flex: 0 0 auto; flex-direction: row; min-width: 0; width: 100%; }
    .tabs { flex-direction: row; flex: 1; }
    .tabs button { flex: 1; width: auto; padding: 0 6px; font-size: 12px; }
    .side button { width: auto; }
    .livebar { flex-direction: row; }
    .side-fill { display: none; }
    #shoot { min-width: 28%; }
    #expModal {
      position: fixed; top: 56px; right: 8px; bottom: auto; left: auto;
      width: 168px; height: min(420px, calc(100dvh - 140px));
    }
    #log { white-space: pre-wrap; max-height: none; }
  }
</style>
<div class="app">
<header>
  <div class="brand">D12600</div>
  <div class="hud" id="hud">
    <div class="hud-cam t off" id="hudT">
      <b>T</b>
      <div class="hud-mid">
        <div class="hud-line"><span class="hud-mode">—</span><span class="hud-iso">ISO —</span><span class="hud-shut">—</span></div>
        <div class="hud-line hud-sub"><span class="hud-wb">—</span><span class="hud-qual">—</span><span class="hud-af">—</span></div>
        <div class="hud-pwr">
          <span class="hud-ico" aria-hidden="true"></span>
          <div class="hud-bat"><i></i></div>
          <span class="hud-pct">—</span>
          <span class="hud-shots"></span>
        </div>
      </div>
    </div>
    <div class="hud-cam r off" id="hudR">
      <b>R</b>
      <div class="hud-mid">
        <div class="hud-line"><span class="hud-mode">—</span><span class="hud-iso">ISO —</span><span class="hud-shut">—</span></div>
        <div class="hud-line hud-sub"><span class="hud-wb">—</span><span class="hud-qual">—</span><span class="hud-af">—</span></div>
        <div class="hud-pwr">
          <span class="hud-ico" aria-hidden="true"></span>
          <div class="hud-bat"><i></i></div>
          <span class="hud-pct">—</span>
          <span class="hud-shots"></span>
        </div>
      </div>
    </div>
  </div>
  <span class="pulse" id="sync">STANDBY</span>
  <span id="host"></span>
  <a href="/lab">LAB</a>
</header>
<div class="main">
<div class="stage">
<div id="tab-view" class="pane">
<div class="previews" id="previews">
  <figure class="t">
    <img id="lvT" alt="T">
    <div class="tag">T</div>
    <div class="jp">+Y</div>
    <div class="meta"><span>BACK</span><span id="stT">—</span></div>
  </figure>
  <figure class="r">
    <img id="lvR" alt="R">
    <div class="tag">R</div>
    <div class="jp">+X</div>
    <div class="meta"><span>SIDE</span><span id="stR">—</span></div>
  </figure>
  <figure class="p" id="panoPrevFig" hidden>
    <canvas id="lvP"></canvas>
    <div class="tag">P</div>
    <div class="jp">20%</div>
    <div class="meta"><span>LIVE STITCH</span><span id="stP">cut</span></div>
  </figure>
</div>
</div>
<div id="tab-usb" class="pane" hidden>
<div class="row">
  <button id="detect">DETECT</button>
  <button id="status">STATUS</button>
  <button id="swap" disabled>SWAP</button>
</div>
<div class="lbl">tap T / R · again to clear</div>
<div id="cams"></div>
</div>
<div id="tab-pano" class="pane" hidden>
<div class="row">
  <button id="panoRefresh">LIST</button>
  <label>Mode
    <select id="panoMode">
      <option value="open">Open</option>
      <option value="match">Match</option>
      <option value="blend">Blend</option>
      <option value="cut">Cut</option>
    </select>
  </label>
  <label class="dlchk"><input type="checkbox" id="flipR">flop R</label>
</div>
<div class="drag">
  <div class="k">Overlap <b id="olVal">20%</b></div>
  <input type="range" id="olDrag" min="5" max="45" value="20" step="1">
</div>
<div id="pairs"></div>
</div>
<div id="tab-files" class="pane" hidden>
<div class="row">
  <button id="filesRefresh">LIST</button>
  <button id="filesToday">before today</button>
  <button id="filesKeep5">keep 5</button>
</div>
<div id="files"></div>
</div>
<div id="tab-set" class="pane" hidden>
<div class="drag">
  <div class="k">ISO <b id="isoVal">400</b></div>
  <input type="range" id="isoDrag" min="0" step="1">
</div>
<div class="drag">
  <div class="k">Shutter <b id="shutVal">1/125</b></div>
  <input type="range" id="shutDrag" min="0" step="1">
</div>
<div class="picks">
  <label>Program
    <select id="program"></select>
  </label>
  <label>WB
    <select id="wb"></select>
  </label>
  <label>Quality
    <select id="quality"></select>
  </label>
</div>
<div class="row"><button id="set">APPLY</button></div>
<label class="dlchk"><input type="checkbox" id="dl">Download files</label>
<label class="dlchk"><input type="checkbox" id="gpioOn">GPIO shutter</label>
<label class="dlchk simpi"><input type="checkbox" id="simPi">Sim as Pi</label>
<div class="row">
  <button id="kioskExit" hidden>Desktop</button>
</div>
</div>
<pre id="log">wake a body · USB MTP/PTP</pre>
</div>
<aside class="side">
  <nav class="tabs">
    <button type="button" class="on" data-tab="view">VIEW</button>
    <button type="button" data-tab="usb">USB</button>
    <button type="button" data-tab="pano">PANO</button>
    <button type="button" data-tab="files">FILES</button>
    <button type="button" data-tab="set">SET</button>
  </nav>
  <div class="livebar" id="livebar">
    <button id="live">LIVE</button>
    <button id="liveStop" hidden>STOP</button>
    <button type="button" id="panoPrev" hidden>PREVIEW</button>
  </div>
  <button type="button" id="exp">ISO</button>
  <div class="side-fill"></div>
  <button id="shoot">FIRE</button>
  <div id="expModal" hidden>
    <div class="vsliders">
      <div class="vdrag">
        <b id="isoFastVal">400</b>
        <div class="slot"><input type="range" class="vert" id="isoFast" min="0" step="1"></div>
        <span>ISO</span>
      </div>
      <div class="vdrag">
        <b id="shutFastVal">1/125</b>
        <div class="slot"><input type="range" class="vert" id="shutFast" min="0" step="1"></div>
        <span>SHUT</span>
      </div>
    </div>
    <button type="button" id="expDone">DONE</button>
  </div>
</aside>
</div>
</div>
<script>
const ISO = ["100","125","160","200","250","320","400","500","640","800","1000","1250",
  "1600","2000","2500","3200","4000","5000","6400","12800","25600"];
const SHUT = ["30","20","15","10","8","6","4","3","2","1.6","1.3","1","0.8","0.6","0.5",
  "1/3","1/4","1/5","1/6","1/8","1/10","1/13","1/15","1/20","1/25","1/30","1/40","1/50",
  "1/60","1/80","1/100","1/125","1/160","1/200","1/250","1/320","1/400","1/500","1/640",
  "1/800","1/1000","1/1250","1/1600","1/2000","1/2500","1/3200","1/4000","1/5000","1/6400","1/8000"];
const WB = [["Auto","Auto"],["Sunny","Sunny"],["Cloudy","Cloudy"],["Flash","Flash"],
  ["Tungsten","Tungsten"],["Fluorescent","Fluor"],["Shade","Shade"]];
const QUAL = [["JPEG Fine","JPEG Fine"],["JPEG Normal","JPEG Norm"],
  ["NEF+Fine","NEF+Fine"],["NEF (Raw)","NEF"]];
const PROG = [["M","M"],["A","A"],["S","S"],["P","P"],["Auto","Auto"]];
const state = { iso:"400", shutter:"1/125", wb:"Auto", quality:"JPEG Fine", program:"M",
  t:"", r:"", live:false, panoPrev:false, timer:0, stamp:"", rows:[],
  stats: { T: { on: false }, R: { on: false } } };
const log = (m, err) => { const el = document.getElementById("log");
  el.textContent = m; el.className = err ? "err" : ""; };
const api = async (path, opt) => {
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const idxOf = (list, val) => {
  const s = String(val || "").replace(/^ISO\s+/i, "").trim();
  return list.findIndex(v => v === s || v === val);
};
const syncDrag = (id, list, key, label) => {
  const el = document.getElementById(id);
  if (!el) return;
  const i = idxOf(list, state[key]);
  if (i >= 0) el.value = String(i);
  const lab = document.getElementById(label);
  if (lab) lab.textContent = state[key];
};
const paintExposure = () => {
  syncDrag("isoDrag", ISO, "iso", "isoVal");
  syncDrag("isoFast", ISO, "iso", "isoFastVal");
  syncDrag("shutDrag", SHUT, "shutter", "shutVal");
  syncDrag("shutFast", SHUT, "shutter", "shutFastVal");
};
const bindDrag = (id, list, key, applyFast) => {
  const el = document.getElementById(id);
  if (!el) return;
  el.max = String(list.length - 1);
  el.oninput = () => {
    let i = parseInt(el.value, 10);
    if (i < 0) i = 0;
    if (i >= list.length) i = list.length - 1;
    state[key] = list[i];
    paintExposure();
    if (applyFast) scheduleApply();
  };
};
const fillSelect = (id, items, key) => {
  const el = document.getElementById(id);
  el.innerHTML = "";
  const rows = items.slice();
  if (state[key] && !rows.some(item => item[0] === state[key])) {
    rows.push([state[key], state[key]]);
  }
  rows.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item[0]; opt.textContent = item[1];
    if (item[0] === state[key]) opt.selected = true;
    el.appendChild(opt);
  });
  el.onchange = () => { state[key] = el.value; };
};
const roleOf = (row) => {
  if (row.serial && row.serial === state.t) return "T";
  if (row.serial && row.serial === state.r) return "R";
  if (row.role === "T" || row.role === "R") return row.role;
  return "";
};
const batPct = (s) => {
  const m = String(s || "").match(/(\d+)\s*%/);
  if (m) return Math.min(100, parseInt(m[1], 10));
  const named = { full: 100, high: 80, normal: 50, medium: 50, low: 20, empty: 5, critical: 8 };
  const k = String(s || "").toLowerCase();
  for (const name of Object.keys(named)) if (k.includes(name)) return named[name];
  return null;
};
const shortQual = (s) => {
  s = String(s || "");
  if (!s || /USB busy|ptpcamerad|\?/.test(s)) return "";
  return s.replace(/^JPEG\s+/i, "").replace(/\s*\(Raw\)/i, "").replace(/^NEF\+.*/i, "NEF+");
};
const shortEv = (s) => {
  s = String(s || "").trim();
  if (!s || /USB busy|ptpcamerad|\?/.test(s)) return "";
  if (s === "0" || s === "0.0" || s === "+0" || s === "0 EV") return "";
  return /[+-]/.test(s) ? s : ((parseFloat(s) > 0 ? "+" : "") + s);
};
const paintHud = () => {
  ["T","R"].forEach(role => {
    const s = state.stats[role] || {};
    const el = document.getElementById("hud"+role);
    const iso = s.iso ? String(s.iso).replace(/^ISO\s+/i, "") : "—";
    const shut = s.shutterspeed || "—";
    const mode = s.expprogram || "—";
    const wb = s.whitebalance || "—";
    const qual = shortQual(s.imagequality) || "—";
    const af = s.focusmode || s.focusmode2 || "";
    const ev = shortEv(s.exposurecompensation);
    const meter = s.meteringmode || "";
    const shots = String(s.availableshots || "").replace(/[^\d]/g, "");
    const bat = s.batterylevel || "";
    const pct = batPct(bat);
    const busy = bat && /USB busy|ptpcamerad|gphoto2/i.test(bat);
    el.classList.toggle("off", !s.on);
    el.classList.toggle("low", pct != null && pct <= 25);
    el.querySelector(".hud-mode").textContent = mode;
    el.querySelector(".hud-iso").textContent = iso === "—" ? "ISO —" : "ISO "+iso;
    el.querySelector(".hud-shut").textContent = shut;
    el.querySelector(".hud-wb").textContent = ev ? wb + "  " + ev : wb;
    el.querySelector(".hud-qual").textContent = qual;
    el.querySelector(".hud-af").textContent = [af, meter].filter(Boolean).join(" · ") || "—";
    el.querySelector(".hud-bat i").style.width = (pct == null ? 0 : pct) + "%";
    el.querySelector(".hud-pct").textContent = busy ? "USB" : (bat || (s.on ? "USB" : "—"));
    el.querySelector(".hud-shots").textContent = shots && !busy ? shots : "";
    const st = document.getElementById("st"+role);
    if (st) st.textContent = s.on
      ? [mode !== "—" ? mode : "", iso !== "—" ? iso : "", shut !== "—" ? shut : "", bat].filter(Boolean).join(" · ") || "USB"
      : "—";
  });
};
const ingestHud = (rows, blocks) => {
  if (rows) {
    state.stats = { T: { on: false }, R: { on: false } };
    rows.forEach(row => {
      const role = roleOf(row);
      if (role) state.stats[role] = Object.assign({}, row, { role, on: true });
    });
  }
  (blocks || []).forEach(b => {
    if (b.role !== "T" && b.role !== "R") return;
    state.stats[b.role] = Object.assign({}, state.stats[b.role], b, { role: b.role, on: true });
  });
  paintHud();
};
const normShut = (s) => String(s || "").trim().replace(/\s+/g, "").replace(/s$/i, "").replace(/"$/, "");
const modeOwnsShutter = (m) => /^(M|S)$/i.test(String(m || "").trim());
const snapFromStatus = (b) => {
  if (b.iso) state.iso = String(b.iso).replace(/^ISO\s+/i, "");
  if (b.shutterspeed && modeOwnsShutter(b.expprogram)) {
    const shut = normShut(b.shutterspeed);
    if (idxOf(SHUT, shut) >= 0) state.shutter = shut;
  }
  paintExposure();
  if (b.whitebalance) { state.wb = b.whitebalance; fillSelect("wb", WB, "wb"); }
  if (b.imagequality) { state.quality = b.imagequality; fillSelect("quality", QUAL, "quality"); }
  if (b.expprogram) { state.program = b.expprogram; fillSelect("program", PROG, "program"); }
};
const shortSerial = (s) => {
  s = String(s || "");
  return s.length > 4 ? s.slice(-4) : s;
};
const camBits = (row) => {
  const model = (row.model || "camera").replace(/^Nikon DSC /, "");
  const bits = [];
  if (row.serial) bits.push("#" + shortSerial(row.serial));
  if (row.port) bits.push(row.port);
  if (row.batterylevel) bits.push(row.batterylevel);
  else if (row.iso) bits.push("ISO " + row.iso);
  return { title: model, sub: bits.join(" · ") || "USB" };
};
const applyPair = (pair, swapped) => {
  if (swapped) {
    const t = state.stats.T, r = state.stats.R;
    state.stats.T = Object.assign({}, r, { role: "T" });
    state.stats.R = Object.assign({}, t, { role: "R" });
  }
  state.t = (pair && pair.T) || "";
  state.r = (pair && pair.R) || "";
  if (!state.t) state.stats.T = { on: false };
  if (!state.r) state.stats.R = { on: false };
  (state.rows || []).forEach(row => {
    row.role = row.serial && row.serial === state.t ? "T"
      : row.serial && row.serial === state.r ? "R" : "";
  });
  const sw = document.getElementById("swap");
  if (sw) sw.disabled = !state.t && !state.r;
  paintHud();
};
let pairing = false;
const paintCams = () => {
  const box = document.getElementById("cams");
  box.innerHTML = "";
  const seen = new Set();
  const addCard = (row, ghost) => {
    const serial = row.serial || "";
    if (serial) seen.add(serial);
    const who = serial && serial === state.t ? "T"
      : serial && serial === state.r ? "R"
      : (row.role || "");
    const info = camBits(row);
    const el = document.createElement("div");
    el.className = "cam" + (who === "T" ? " is-t" : who === "R" ? " is-r" : "") + (ghost ? " ghost" : "");
    const note = ghost ? " · offline" : serial ? "" : " · wake for serial";
    el.innerHTML = `<div><b>${who ? who + "  " : ""}${info.title}</b><span>${info.sub}${note}</span></div>`;
    ["T","R"].forEach(role => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = role;
      b.className = "role" + (who === role ? " on" : "");
      b.disabled = !serial || pairing;
      b.onclick = () => assignRole(role, who === role ? "" : serial).catch(e => log(e.message, true));
      el.appendChild(b);
    });
    box.appendChild(el);
    if (who === "T" || who === "R") {
      const st = document.getElementById("st"+who);
      if (st) st.textContent = (row.batterylevel || row.iso || "USB");
    }
  };
  (state.rows || []).forEach(row => addCard(row, false));
  [["T", state.t], ["R", state.r]].forEach(([role, serial]) => {
    if (serial && !seen.has(serial))
      addCard({ serial, role, model: "saved" }, true);
  });
  if (!(state.rows || []).length && !state.t && !state.r) {
    box.innerHTML = "<div class='cam'><div><b>NO BODIES</b><span>MTP/PTP · wake · plug USB</span></div></div>";
  }
};
const fill = (rows, pair) => {
  state.rows = rows || [];
  if (pair) applyPair(pair);
  else (rows || []).forEach(row => {
    if (row.role === "T" && row.serial) state.t = row.serial;
    if (row.role === "R" && row.serial) state.r = row.serial;
  });
  paintCams();
  ingestHud(rows);
};
const assignRole = async (role, serial) => {
  if (pairing) return;
  pairing = true;
  paintCams();
  try {
    const body = role === "T" ? { t: serial } : { r: serial };
    const j = await api("/api/pair", { method:"POST",
      headers:{"content-type":"application/json"},
      body: JSON.stringify(body) });
    applyPair(j.pair);
    paintCams();
    log(j.message);
  } finally { pairing = false; paintCams(); }
};
const bind = (id, fn) => {

const liveOverlap = () => {
  const el = document.getElementById("olDrag");
  const n = el ? parseInt(el.value, 10) : 20;
  return Math.min(0.45, Math.max(0.05, (n || 20) / 100));
};
const composePano = () => {
  if (!state.panoPrev || !state.live) return;
  const t = document.getElementById("lvT");
  const r = document.getElementById("lvR");
  const canvas = document.getElementById("lvP");
  if (!canvas || !t.naturalWidth || !r.naturalWidth) return;
  const flip = document.getElementById("flipR") && document.getElementById("flipR").checked;
  const ol = liveOverlap();
  const h = Math.min(t.naturalHeight, r.naturalHeight);
  const tw = Math.round(t.naturalWidth * h / t.naturalHeight);
  const rw = Math.round(r.naturalWidth * h / r.naturalHeight);
  const seam = Math.max(1, Math.round(tw * (1 - ol)));
  const width = seam + rw;
  if (canvas.width !== width || canvas.height !== h) {
    canvas.width = width;
    canvas.height = h;
  }
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, width, h);
  ctx.drawImage(t, 0, 0, t.naturalWidth, t.naturalHeight, 0, 0, tw, h);
  ctx.save();
  if (flip) {
    ctx.translate(seam + rw, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(r, 0, 0, r.naturalWidth, r.naturalHeight, 0, 0, rw, h);
  } else {
    ctx.drawImage(r, 0, 0, r.naturalWidth, r.naturalHeight, seam, 0, rw, h);
  }
  ctx.restore();
  ctx.fillStyle = "rgba(196,92,38,0.85)";
  ctx.fillRect(seam, 0, 1, h);
  const jp = document.querySelector("#panoPrevFig .jp");
  if (jp) jp.textContent = Math.round(ol * 100) + "%" + (flip ? " flop" : "");
  const st = document.getElementById("stP");
  if (st) st.textContent = "cut";
};
const paintPanoPrev = () => {
  const on = !!(state.live && state.panoPrev);
  const box = document.getElementById("previews");
  const fig = document.getElementById("panoPrevFig");
  const btn = document.getElementById("panoPrev");
  if (box) box.classList.toggle("pano-on", on);
  if (fig) fig.hidden = !on;
  if (btn) {
    btn.hidden = !state.live;
    btn.classList.toggle("on", on);
  }
  if (on) composePano();
};
const setLiveSrc = (on) => {
  state.live = on;
  document.body.classList.toggle("live", on);
  const sync = document.getElementById("sync");
  if (sync) sync.textContent = on ? "ACTIVE" : "STANDBY";
  const liveBtn = document.getElementById("live");
  if (liveBtn) liveBtn.textContent = on ? "STOP" : "LIVE";
  if (state.timer) { clearTimeout(state.timer); state.timer = 0; }
  paintPanoPrev();
  if (!on) {
    ["T","R"].forEach(role => { document.getElementById("lv"+role).src = ""; });
    return;
  }
  const tick = async () => {
    if (!state.live) return;
    for (const role of ["T","R"]) {
      try {
        const r = await fetch("/api/live/"+role+".jpg", { cache:"no-store" });
        if (r.ok && (r.headers.get("content-type") || "").includes("jpeg")) {
          const url = URL.createObjectURL(await r.blob());
          const img = document.getElementById("lv"+role);
          const old = img.src;
          img.onload = () => { if (state.panoPrev) composePano(); };
          img.src = url;
          if (old.startsWith("blob:")) URL.revokeObjectURL(old);
        }
      } catch (e) {}
    }
    state.timer = setTimeout(tick, 280);
  };
  tick();
};
const usb = async (fn) => {
  const was = state.live;
  setLiveSrc(false);
  try { return await fn(); }
  finally { if (was) {
    try { await api("/api/live/start", { method:"POST" }); setLiveSrc(true); }
    catch (e) { log(e.message, true); }
  } }
};

const applyHud = (all) => {

        state.stats[role].whitebalance = state.wb;
        state.stats[role].imagequality = state.quality;
      }

  });

const stitchLine = (p) => {
  const s = p.stitch || {};
  if (s.running) return (s.message || "stitching…") + (s.log && s.log.length > 1 ? "\n" + s.log.slice(-3).join("\n") : "");
  if (s.error) return s.error;
  if (s.message) return s.message;
  if (p.pano) return "stitched  " + p.pano;
  return p.ready ? "ready  pick Match / Blend / Cut" : "need T and R";
};
const paintPairStat = (el, p) => {
  const s = p.stitch || {};
  el.textContent = stitchLine(p);
  el.className = "pair-stat" + (s.running ? " run" : s.error ? " err" : "");
};
let panoTimer = 0;
const loadPairs = async (silent) => {
  const j = await api("/api/captures");
  const box = document.getElementById("pairs");
  const seen = new Set();
  (j.pairs || []).forEach(p => {
    seen.add(p.stamp);
    let el = box.querySelector(`[data-stamp="${p.stamp}"]`);
    if (!el) {
      el = document.createElement("div");
      el.className = "pair";
      el.dataset.stamp = p.stamp;
      el.innerHTML = `<div class="pair-frames">
          <figure><figcaption>T</figcaption><img class="pt" alt="T"></figure>
          <figure><figcaption>R</figcaption><img class="pr" alt="R"></figure>
          <figure class="pair-pano"><figcaption>PANO</figcaption><img class="pp" alt="P"></figure>
        </div>
        <div class="pair-stat"></div>
        <div class="pair-acts"><button type="button" class="go">結合 STITCH</button>
          <span class="who">${p.stamp}</span></div>`;
      el.querySelector(".go").onclick = () => startPano(p.stamp).catch(e => {
        el.querySelector(".pair-stat").className = "pair-stat err";
        el.querySelector(".pair-stat").textContent = e.message;
        log(e.message, true);
      });
      box.appendChild(el);
    }
    const setImg = (sel, name, w) => {
      const img = el.querySelector(sel);
      if (!name) { img.removeAttribute("src"); return; }
      const next = "/api/file/"+encodeURIComponent(name)+"?w="+w;
      if (!img.src.includes(encodeURIComponent(name))) img.src = next + "&t="+Date.now();
      else if ((p.stitch || {}).phase === "done") img.src = next + "&t="+Date.now();
    };
    setImg(".pt", p.t, 240);
    setImg(".pr", p.r, 240);
    setImg(".pp", p.pano, 720);
    el.querySelector(".go").disabled = !p.ready || !!(p.stitch && p.stitch.running);
    paintPairStat(el.querySelector(".pair-stat"), p);
  });
  [...box.querySelectorAll(".pair")].forEach(el => {
    if (!seen.has(el.dataset.stamp)) el.remove();
  });
  if (!(j.pairs || []).length) {
    if (!box.querySelector(".cam"))
      box.innerHTML = "<div class='cam'><div><b>NO PAIRS</b><span>回収 FIRE writes T_/R_ JPEGs</span></div></div>";
  } else {
    const empty = box.querySelector(":scope > .cam");
    if (empty) empty.remove();
  }
  const busy = (j.pairs || []).some(p => p.stitch && p.stitch.running);
  if (busy && !panoTimer) panoTimer = setInterval(() => loadPairs(true).catch(() => {}), 700);
  if (!busy && panoTimer) { clearInterval(panoTimer); panoTimer = 0; }
  if (!silent) log(j.message);
};

const fileThumb = (name, label) => name
  ? `<img alt="${label}" src="/api/file/${encodeURIComponent(name)}?w=240">`
  : `<span class="who">${label} —</span>`;
const loadFiles = async (pairs, message) => {
  let rows = pairs;
  if (!rows) {
    const j = await api("/api/captures");
    rows = j.pairs || [];
    if (message == null) message = j.message;
  }
  const box = document.getElementById("files");
  box.innerHTML = "";
  (rows || []).forEach(p => {
    const el = document.createElement("div");
    el.className = "file";
    el.innerHTML = `<div class="thumbs">${fileThumb(p.t,"T")}${fileThumb(p.r,"R")}${fileThumb(p.pano,"P")}</div>
      <span class="who">${p.stamp}${p.ready ? "" : " · 欠"}</span>
      <div class="acts"></div>`;
    const acts = el.querySelector(".acts");
    [["T","T"],["R","R"],["P","P"],["","全削除"]].forEach(([side, label]) => {
      if (side === "T" && !p.t) return;
      if (side === "R" && !p.r) return;
      if (side === "P" && !p.pano) return;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "削除 " + label;
      b.onclick = async () => {
        try {
          const j = await api("/api/captures/delete", { method:"POST",
            headers:{"content-type":"application/json"},
            body: JSON.stringify({ stamp: p.stamp, side }) });
          log(j.message);
          await loadFiles(j.pairs, j.message);
          if (document.getElementById("tab-pano") && !document.getElementById("tab-pano").hidden)
            await loadPairs();
        } catch (e) { log(e.message, true); }
      };
      acts.appendChild(b);
    });
    box.appendChild(el);
  });
  if (!(rows || []).length) {
    box.innerHTML = "<div class='cam'><div><b>NO FILES</b><span>captures/ is empty</span></div></div>";
  }
  if (message) log(message);
};
const filesPost = (path, body, warn) => async () => {
  if (warn && !confirm(warn)) return;
  const j = await api(path, { method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify(body || {}) });
  log(j.message);
  await loadFiles(j.pairs, j.message);
};
bind("filesRefresh", () => loadFiles());
bind("filesToday", filesPost("/api/captures/before-today", {}, "Delete every capture from before today?"));
bind("filesKeep5", filesPost("/api/captures/keep-last", { n: 5 }, "Keep only the 5 newest captures?"));
const showTab = (name) => {
  document.querySelectorAll(".tabs [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  ["view","usb","pano","files","set"].forEach(tab => {
    document.getElementById("tab-"+tab).hidden = tab !== name;
  });
  const livebar = document.getElementById("livebar");
  if (livebar) livebar.hidden = name !== "view";
  if (name === "pano") loadPairs().catch(e => log(e.message, true));
  if (name === "files") loadFiles().catch(e => log(e.message, true));
};
document.querySelectorAll(".tabs [data-tab]").forEach(b => {
  b.onclick = () => {
    location.hash = b.dataset.tab;
    showTab(b.dataset.tab);
  };
});
const startParams = new URLSearchParams(location.search);
const startTab = startParams.get("tab")
  || (startParams.has("kiosk") ? "view" : (location.hash || "").replace("#","") || "view");
showTab(["view","usb","pano","files","set"].includes(startTab) ? startTab : "view");
bindDrag("isoDrag", ISO, "iso", false);
bindDrag("isoFast", ISO, "iso", true);
bindDrag("shutDrag", SHUT, "shutter", false);
bindDrag("shutFast", SHUT, "shutter", true);
paintExposure();
const expModal = document.getElementById("expModal");
const expBtn = document.getElementById("exp");
const sizeVerts = () => {
  document.querySelectorAll("#expModal .vdrag .slot").forEach(slot => {
    slot.style.setProperty("--vh", slot.clientHeight + "px");
  });
};
const showExp = (on) => {
  expModal.hidden = !on;
  expBtn.classList.toggle("on", on);
  if (on) {
    paintExposure();
    requestAnimationFrame(sizeVerts);
  }
};
window.addEventListener("resize", () => {
  if (!expModal.hidden) sizeVerts();
});
expBtn.onclick = () => showExp(expModal.hidden);
document.getElementById("expDone").onclick = () => showExp(false);
if (startParams.has("exp")) showExp(true);
fillSelect("program", PROG, "program");
fillSelect("wb", WB, "wb");
fillSelect("quality", QUAL, "quality");
if (navigator.wakeLock) {
  const lock = () => navigator.wakeLock.request("screen").catch(() => {});
  lock(); document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") lock();
  });
}
const inKiosk = new URLSearchParams(location.search).has("kiosk");
if (inKiosk) document.body.classList.add("kiosk");
const paintKiosk = (on) => {
  document.getElementById("kioskExit").hidden = !(inKiosk || on);
};
const paintSettings = (s) => {
  if (!s) return;
  const dl = document.getElementById("dl");
  const g = document.getElementById("gpioOn");
  if (dl && "download" in s) dl.checked = !!s.download;
  if (g && "gpio" in s) g.checked = !!s.gpio;
};
const saveSettings = async () => {
  const j = await api("/api/settings", { method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({
      download: document.getElementById("dl").checked,
      gpio: document.getElementById("gpioOn").checked,
    }) });
  paintSettings(j);
  log(j.message);
};
document.getElementById("dl").onchange = () => saveSettings().catch(e => log(e.message, true));
document.getElementById("gpioOn").onchange = () => saveSettings().catch(e => log(e.message, true));
const paintGpio = (g) => {
  const box = document.getElementById("simPi");
  if (box) box.checked = !!(g && g.sim);
};
document.getElementById("simPi").onchange = async () => {
  try {
    const j = await api("/api/gpio", { method:"POST",
      headers:{"content-type":"application/json"},
      body: JSON.stringify({ sim: document.getElementById("simPi").checked }) });
    paintGpio(j);
    log(j.message);
  } catch (e) { log(e.message, true); }
};
bind("kioskExit", async () => {
  if (!confirm("Leave kiosk and return to the desktop?")) return;
  try {
    const j = await api("/api/kiosk/exit", { method:"POST",
      headers:{"content-type":"application/json"}, body: "{}" });
    log(j.message);
  } catch (e) { log(e.message, true); }
});
api("/api/meta").then(j => {
  document.getElementById("host").textContent = (j.phone || "").replace(/^https?:\/\//,"").replace(/:8787\/?$/,"");
  paintGpio(j.gpio);
  paintSettings(j.settings);
  paintKiosk(j.kiosk);
}).catch(() => {});
if (inKiosk) paintKiosk(true);
api("/api/detect").then(async j => {
  fill(j.cameras, j.pair); log(j.message);
  if ((j.cameras || []).length) {
    const s = await api("/api/status");
    fill(s.cameras, s.pair);
    ingestHud(s.cameras, s.status);
    (s.status || []).forEach(b => {
      if (b.role === "T" || b.role === "R") snapFromStatus(b);
    });
  }
}).catch(e => log(e.message, true));
</script>
