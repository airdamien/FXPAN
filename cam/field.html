<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="D12600">
<meta name="theme-color" content="#0b0b0c">
<title>D12600</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101214;
    --ink: #e8eaed;
    --dim: #8b939e;
    --line: #2f3640;
    --t: #9a5cff;
    --r: #c45c26;
    --fire: #b42318;
    --ok: #6cff4d;
    --btn: #1c2128;
    --side: 168px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none; }
  html { scrollbar-gutter: stable; }
  ::-webkit-scrollbar { width: 48px; height: 48px; }
  ::-webkit-scrollbar-track { background: #1a1e24; }
  ::-webkit-scrollbar-thumb { background: #6a7380; border-radius: 12px; min-height: 64px; }
  ::-webkit-scrollbar-thumb:active { background: #8b939e; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.25 "DejaVu Sans", Futura, "Hiragino Sans", system-ui, sans-serif;
    touch-action: manipulation;
    overflow: hidden;
  }
  body.live .pulse { color: var(--ok); }
  .app { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px 6px 12px;
    border-bottom: 1px solid var(--line);
    min-height: 48px;
  }
  .brand {
    flex: 0 0 auto; font: 700 18px/1 "DejaVu Sans", sans-serif;
    letter-spacing: 0.08em; color: #f2f4f8;
  }
  .brand.fx {
    font-family: Futura, "Avenir Next", "Century Gothic", sans-serif;
    letter-spacing: 0.16em;
  }
  header a { color: var(--r); font-size: 12px; letter-spacing: 0.12em; text-decoration: none; }
  #host, .pulse { color: var(--dim); font-size: 12px; letter-spacing: 0.06em; white-space: nowrap; }
  .pulse { min-width: 4.5em; text-align: right; }
  .main { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 8px 10px 8px 10px; }
  .stage { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .side {
    flex: 0 0 var(--side); min-width: var(--side); min-height: 0;
    display: flex; flex-direction: column; gap: 8px;
    position: relative;
    overflow: hidden;
    z-index: 2;
  }
  #exp.on { background: var(--r); border-color: var(--r); color: #fff; }
  #live.on { background: var(--ok); border-color: var(--ok); color: #101214; }
  #expModal {
    position: absolute; top: 0; right: 0; bottom: 128px; left: auto;
    width: 176px; z-index: 5;
    background: #101214; border-radius: 8px;
    display: flex; flex-direction: column; gap: 8px; padding: 8px 4px;
    overflow: hidden;
  }
  #expModal[hidden] { display: none !important; }
  .vsliders {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  }
  .vdrag {
    display: flex; flex-direction: column; align-items: center;
    min-height: 0; min-width: 0; gap: 4px;
    overflow: hidden;
  }
  .vdrag b {
    color: var(--r); font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
    text-align: center; line-height: 1.15; min-height: 2.2em;
    display: flex; align-items: center; justify-content: center;
  }
  .vdrag span { color: var(--dim); font-size: 10px; letter-spacing: 0.12em; }
  .vdrag .slot {
    flex: 1; min-height: 0; width: 100%; position: relative;
  }
  input[type=range].vert {
    -webkit-appearance: none; appearance: none;
    position: absolute; top: 50%; left: 50%;
    width: var(--vh, 240px); height: 44px; margin: 0;
    transform: translate(-50%, -50%) rotate(-90deg);
    background: transparent;
  }
  input[type=range].vert::-webkit-slider-runnable-track {
    height: 3px; background: #2f3640;
  }
  input[type=range].vert::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px;
    background: var(--r); margin-top: -10px; border: 0; border-radius: 50%;
  }
  #expDone { width: 100%; min-height: 48px; }
  .tabs { display: flex; flex-direction: column; gap: 8px; }
  .side button { width: 100%; }
  .tabs button.on { background: var(--r); border-color: var(--r); color: #fff; }
  .side-fill { flex: 1; min-height: 0; }
  .pane {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
  }
  .pane[hidden] { display: none !important; }
  .previews {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr);
    gap: 8px;
  }
  .previews.pano-on { grid-template-rows: minmax(0, 1fr) minmax(140px, 46%); }
  .previews figure {
    margin: 0; position: relative; background: #0b0d10; min-height: 0; overflow: hidden;
    outline: 1px solid var(--line);
  }
  .previews figure.t { outline-color: var(--t); }
  .previews figure.r { outline-color: var(--r); }
  .previews figure.r.flop img { transform: scaleX(-1); }
  .previews figure.p {
    grid-column: 1 / -1; outline-color: #c9a227;
    display: flex; align-items: center; justify-content: center;
  }
  .previews figure.p[hidden] { display: none !important; }
  .previews figure img, .previews figure canvas {
    width: 100%; height: 100%; object-fit: contain; display: block; background: #0b0d10;
  }
  .previews figure.p canvas {
    width: auto; height: 100%; max-width: 100%; object-fit: contain;
  }
  .previews .tag {
    position: absolute; top: 6px; left: 8px; z-index: 1;
    font: 800 20px/1 sans-serif; letter-spacing: 0.08em;
    text-shadow: 0 0 8px currentColor;
  }
  .previews .jp {
    position: absolute; top: 8px; right: 8px; z-index: 1;
    font-size: 10px; letter-spacing: 0.18em; opacity: 0.85;
  }
  .previews .meta {
    position: absolute; left: 7px; bottom: 7px; right: 7px; z-index: 1;
    font-size: 10px; letter-spacing: 0.12em; text-shadow: 0 1px 3px #000;
    display: flex; justify-content: space-between;
  }
  .t .tag, .t .meta, .t .jp { color: var(--t); }
  .r .tag, .r .meta, .r .jp { color: var(--r); }
  .previews figure.out { outline-color: #c45c26; outline-width: 3px; }
  .previews figure.out .tag { color: #c45c26; }
  .p .tag, .p .meta, .p .jp { color: #c9a227; }
  #panoPrev.on { background: var(--r); border-color: var(--r); color: #fff; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 0 0 auto; }
  .side-foot {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px;
    margin-top: auto;
  }
  button, .chip {
    appearance: none; border: 1px solid var(--line); background: var(--btn); color: var(--ink);
    font: 700 15px/1.1 "DejaVu Sans", sans-serif; letter-spacing: 0.08em;
    min-height: 44px; padding: 0 12px; border-radius: 8px;
  }
  button:active, .chip.on { background: #3a414c; }
  button:disabled { opacity: 0.4; }
  .chip { min-width: 52px; text-align: center; }
  .lbl { width: 100%; color: var(--dim); font-size: 11px; letter-spacing: 0.14em;
         text-transform: uppercase; margin: 0; flex: 0 0 auto; }
  .drag { margin: 0; flex: 0 0 auto; }
  .drag .k {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    color: var(--dim); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .drag .k b { color: var(--r); font-size: 22px; letter-spacing: 0.04em; font-weight: 700; margin-left: auto; }
  button.auto {
    min-height: 36px; min-width: 64px; padding: 0 10px; width: auto;
    font-size: 12px; letter-spacing: 0.12em;
  }
  button.auto.on { background: var(--r); border-color: var(--r); color: #fff; }
  .vdrag button.auto { width: 100%; min-width: 0; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 40px;
    background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; background: #2f3640; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px;
    background: var(--r); margin-top: -10px; border: 0; border-radius: 50%;
  }
  .picks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex: 0 0 auto; }
  .picks label { display: flex; flex-direction: column; gap: 5px; color: var(--dim);
                 font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
  select {
    font: 16px/1.2 inherit; min-height: 44px; padding: 0 10px; border-radius: 8px;
    background: var(--btn); color: var(--ink); border: 1px solid var(--line);
  }
  #tab-usb, #tab-pano, #tab-files, #tab-set { overflow: auto; }
  .sect {
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px 0 4px;
    border-top: 1px solid var(--line);
  }
  .sect:first-child { border-top: 0; padding-top: 0; }
  #wifiNets { display: grid; gap: 8px; }
  #wifiStat, #wifiApInfo {
    color: var(--dim); font: 13px/1.35 ui-monospace, Menlo, monospace;
    letter-spacing: 0; white-space: pre-wrap; min-height: 1.2em;
  }
  #wifiApInfo { color: var(--ok); }
  #wifiApInfo[hidden], #wifiJoin[hidden] { display: none !important; }
  #wifiJoin { display: grid; gap: 8px; }
  #wifiJoin input {
    font: 16px inherit; min-height: 44px; width: 100%;
    padding: 0 10px; border-radius: 8px;
    background: var(--btn); color: var(--ink); border: 1px solid var(--line);
  }
  #wifiAp.on { background: var(--r); border-color: var(--r); color: #fff; }
  .wifi-net {
    width: 100%; text-align: left; letter-spacing: 0; font-weight: 400;
    border: 1px solid var(--line); padding: 10px 12px; border-radius: 8px;
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
    background: #0b0d10;
  }
  .wifi-net.on { border-color: var(--ok); }
  .wifi-net b { font-size: 13px; letter-spacing: 0.04em; }
  .wifi-net span { display: block; color: var(--dim); font-size: 12px; }
  #cams, #pairs, #files {
    flex: 1; min-height: 0; overflow: auto; display: grid; gap: 8px; align-content: start;
    user-select: none; -webkit-user-select: none;
  }
  #cams { touch-action: none; }
  #pairs, #files { touch-action: pan-y; }
  #pairs figure, #files .thumbs img { cursor: zoom-in; }
  #tab-set { touch-action: pan-y; }
  #tab-set { display: flex; flex-direction: column; }
  .set-tabs {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    flex: 0 0 auto; padding: 0 0 10px;
  }
  .set-tabs button { min-height: 40px; font-size: 12px; letter-spacing: 0.12em; }
  .set-tabs button.on { border-color: var(--r); color: #fff; }
  .set-foot {
    margin-top: auto; display: flex; justify-content: flex-end;
    padding: 10px 0 4px; position: sticky; bottom: 0;
    background: linear-gradient(transparent, var(--bg) 28%);
  }
  .set-foot #set { min-width: 120px; }
  #files img, #pairs img { -webkit-user-drag: none; }
  #picModal {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(6,8,10,0.88);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  #picModal[hidden] { display: none !important; }
  .pic-box {
    width: min(1100px, 100%); max-height: 100%;
    display: flex; flex-direction: column; gap: 10px;
  }
  .pic-big {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    background: #0b0d10; border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden;
  }
  .pic-big img { max-width: 100%; max-height: min(78vh, 1100px); object-fit: contain; cursor: zoom-in; }
  .pic-thumbs { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .pic-thumbs button {
    padding: 0; border: 3px solid var(--line); border-radius: 8px; overflow: hidden;
    background: #0b0d10; flex: 1 1 200px; max-width: 340px; min-width: 160px;
  }
  .pic-thumbs button.on { border-color: var(--ok); }
  .pic-thumbs img { display: block; width: 100%; height: 160px; object-fit: cover; }
  .pic-acts {
    display: flex; gap: 8px; align-items: center; justify-content: flex-end;
  }
  .pic-acts .who { margin-right: auto; color: var(--dim); font-size: 13px; }
  #picKeep { background: var(--ok); border-color: var(--ok); color: #101214; }
  .cam {
    border: 1px solid var(--line); padding: 10px 12px; border-radius: 8px;
    display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
    background: #0b0d10;
  }
  .cam.is-t { border-color: var(--t); }
  .cam.is-r { border-color: var(--r); }
  .cam.ghost { opacity: 0.55; }
  .cam b { font-size: 13px; letter-spacing: 0.08em; }
  .cam span { display: block; color: var(--dim); font-size: 12px; }
  .cam button.role { min-width: 48px; letter-spacing: 0.12em; }
  .cam button.role.on { color: #fff; }
  .cam.is-t button.role.on { background: var(--t); border-color: var(--t); }
  .cam.is-r button.role.on { background: var(--r); border-color: var(--r); }
  #log {
    flex: 0 0 auto; margin: 0; color: var(--dim); max-height: 2.6em;
    font: 13px/1.3 ui-monospace, "DejaVu Sans Mono", Menlo, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #log.err { color: #ff3b3b; }
  .dlchk {
    display: flex; align-items: center; justify-content: flex-start; gap: 7px;
    color: var(--dim); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; min-height: 40px; white-space: nowrap;
  }
  .dlchk input {
    appearance: none; -webkit-appearance: none;
    width: 18px; height: 18px; margin: 0; border-radius: 4px;
    border: 1px solid var(--line); background: var(--btn);
  }
  .dlchk input:checked { background: var(--r); border-color: var(--r); }
  .dlchk:has(input:checked) { color: #fff; }
  .simpi { margin-left: 0; justify-content: flex-start; }
  #shoot {
    background: var(--fire); border-color: var(--fire); color: #fff;
    font-size: 18px; letter-spacing: 0.16em; font-weight: 700; min-height: 72px;
    flex: 0 0 auto; position: relative; z-index: 6;
  }
  body.kiosk { cursor: none; }
  body.kiosk header a[href="/lab"] { display: none; }
  #kioskExit[hidden] { display: none !important; }
  .pair {
    display: grid; gap: 6px; width: 100%; padding: 8px; text-align: left;
    border: 1px solid var(--line); border-radius: 8px; background: #0b0d10;
  }
  .pair-frames {
    display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 6px; align-items: start;
  }
  .pair-frames figure.flop img, .file .thumbs img.flop { transform: scaleX(-1); }
  .space {
    display: grid; gap: 6px; padding: 4px 0 10px;
  }
  .space-track {
    height: 10px; border-radius: 6px; background: #1a1e24;
    border: 1px solid var(--line); overflow: hidden;
  }
  .space-track i {
    display: block; height: 100%; width: 0; background: var(--ok);
    border-radius: 6px;
  }
  .space.low .space-track i { background: var(--fire); }
  .space span {
    color: var(--dim); font: 12px/1.3 ui-monospace, Menlo, monospace;
    letter-spacing: 0;
  }
  .pair-frames figcaption { color: var(--dim); font-size: 10px; letter-spacing: 0.12em; }
  .pair img { width: 100%; aspect-ratio: 3/2; object-fit: cover; background: #000; }
  .pair-pano img { aspect-ratio: 16/6; object-fit: contain; }
  .pano-stat {
    flex: 1; min-width: 0; color: var(--dim);
    font: 12px/1.3 ui-monospace, Menlo, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pano-stat.run { color: var(--r); }
  .pano-stat.err { color: #ff3b3b; }
  .pair-stat {
    color: var(--dim); font: 12px/1.35 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; min-height: 1.4em;
  }
  .pair-stat b {
    display: inline-block; min-width: 4.6em; margin-right: 6px;
    letter-spacing: 0.08em;
  }
  .pair-stat.err { color: #ff3b3b; }
  .pair-stat.run, .pair-stat.queued { color: var(--r); }
  .pair-stat.ok { color: var(--ok); }
  .pair.err { border-color: #ff3b3b; }
  .pair.run, .pair.queued { border-color: var(--r); }
  .pair-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pair-acts .who { color: var(--dim); font-size: 11px; letter-spacing: 0.1em; }
  .file {
    display: grid; gap: 8px; padding: 10px;
    border: 1px solid var(--line); border-radius: 8px; background: #0b0d10;
  }
  .file .thumbs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; position: relative; }
  .file img { width: 100%; aspect-ratio: 3/2; object-fit: cover; background: #000; }
  .lock {
    position: absolute; top: 6px; left: 6px; z-index: 2;
    width: 36px; height: 36px; min-height: 36px; padding: 0; border-radius: 8px;
    display: grid; place-items: center;
    background: rgba(10, 12, 16, 0.78); border: 1px solid var(--line); color: var(--dim);
  }
  .lock svg { width: 18px; height: 18px; fill: currentColor; }
  .lock.on { color: var(--ok); border-color: var(--ok); }
  .file.locked { border-color: var(--ok); }
  .pic-big { position: relative; }
  .pic-big .lock { top: 10px; left: 10px; }
  .file .who { color: var(--dim); font-size: 10px; letter-spacing: 0.14em; }
  .file .exif, .pair .exif {
    color: var(--dim); font: 11px/1.35 ui-monospace, Menlo, monospace;
    letter-spacing: 0;
  }
  .file .exif .t, .pair .exif .t { color: var(--t); }
  .file .exif .r, .pair .exif .r { color: var(--r); }
  .file .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .file .acts a {
    display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none;
  }
  .file .acts button.danger { border-color: var(--fire); color: #f3b4b0; }
  .hud {
    flex: 1; min-width: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .hud-cam {
    display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .hud-cam b {
    font: 800 18px/1 sans-serif; letter-spacing: 0.06em; min-width: 1.05em;
  }
  .hud-cam.t b { color: var(--t); }
  .hud-cam.r b { color: var(--r); }
  .hud-mid { flex: 1; min-width: 0; }
  .hud-line {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 13px; letter-spacing: 0.04em;
  }
  .hud-sub { display: none; }
  .hud-pwr { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .hud-ico {
    flex: 0 0 auto; width: 14px; height: 8px; box-sizing: border-box;
    border: 1px solid currentColor; color: var(--dim); position: relative;
  }
  .hud-ico::after {
    content: ""; position: absolute; right: -3px; top: 1px;
    width: 2px; height: 4px; background: currentColor;
  }
  .hud-bat { flex: 1; min-width: 0; height: 5px; background: #2a2f36; overflow: hidden; }
  .hud-bat i { display: block; height: 100%; width: 0; background: var(--ok); }
  .hud-pct { color: var(--dim); font-size: 11px; letter-spacing: 0.06em; white-space: nowrap; }
  .hud-shots { color: var(--dim); font-size: 10px; letter-spacing: 0.06em; white-space: nowrap; }
  .hud-shots:empty { display: none; }
  .hud-cam.low .hud-bat i { background: var(--fire); }
  .hud-cam.low .hud-ico, .hud-cam.low .hud-pct { color: var(--fire); }
  .hud-cam.off { opacity: 0.35; }
  #osk {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
    background: #0b0d10; border-top: 1px solid var(--line);
    padding: 6px 8px max(8px, env(safe-area-inset-bottom));
    display: grid; gap: 4px;
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45);
  }
  #osk[hidden] { display: none !important; }
  .osk-row { display: flex; gap: 4px; justify-content: center; }
  .osk-key {
    flex: 1 1 0; min-width: 0; max-width: 76px;
    min-height: 40px; padding: 0 4px; border-radius: 6px;
    font: 700 15px/1 "DejaVu Sans", sans-serif; letter-spacing: 0.04em;
    background: var(--btn); color: var(--ink); border: 1px solid var(--line);
  }
  .osk-key.on { background: var(--r); border-color: var(--r); color: #fff; }
  .osk-key.wide { flex: 1.6 1 0; max-width: 112px; font-size: 12px; letter-spacing: 0.1em; }
  .osk-key.enter { background: var(--ok); border-color: var(--ok); color: #101214; }

<script>
const ISO = ["Auto","100","125","160","200","250","320","400","500","640","800","1000","1250",
  "1600","2000","2500","3200","4000","5000","6400","12800","25600"];
const SHUT = ["Auto","30","20","15","10","8","6","4","3","2","1.6","1.3","1","0.8","0.6","0.5",
  "1/3","1/4","1/5","1/6","1/8","1/10","1/13","1/15","1/20","1/25","1/30","1/40","1/50",
  "1/60","1/80","1/100","1/125","1/160","1/200","1/250","1/320","1/400","1/500","1/640",
  "1/800","1/1000","1/1250","1/1600","1/2000","1/2500","1/3200","1/4000","1/5000","1/6400","1/8000"];
const FSTOP = ["Auto","1.4","1.8","2","2.2","2.5","2.8","3.2","3.5","4","4.5","5","5.6",
  "6.3","7.1","8","9","10","11","13","14","16","18","20","22"];
const WB = [["Auto","Auto"],["Sunny","Sunny"],["Cloudy","Cloudy"],["Flash","Flash"],
  ["Tungsten","Tungsten"],["Fluorescent","Fluor"],["Shade","Shade"]];
const QUAL = [["JPEG Fine","JPEG Fine"],["JPEG Normal","JPEG Norm"],
  ["NEF+Fine","NEF+Fine"],["NEF (Raw)","NEF"]];
const PROG = [["M","M"],["A","A"],["S","S"],["P","P"],["Auto","Auto"]];
const state = { iso:"400", shutter:"1/125", fstop:"5.6", wb:"Auto", quality:"JPEG Fine", program:"M",
  t:"", r:"", live:false, liveOk:false, panoPrev:false, timer:0, stamp:"", rows:[],
  previewS: 10,
  idleMin: 10,
  idle: false,
  followCam: false,
  stats: { T: { on: false }, R: { on: false } } };
const log = (m, err) => { const el = document.getElementById("log");
  el.textContent = m; el.className = err ? "err" : ""; };
const api = async (path, opt) => {
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const isAuto = (val) => /^auto$/i.test(String(val || "").trim());
const idxOf = (list, val) => {
  const s = String(val || "").replace(/^ISO\s+/i, "").replace(/^f\/?/i, "").trim();
  return list.findIndex(v => v === s || v === val || v.toLowerCase() === s.toLowerCase());
};
const syncDrag = (id, list, key, label) => {
  const el = document.getElementById(id);
  if (!el) return;
  const i = idxOf(list, state[key]);
  if (i >= 0) el.value = String(i);
  const lab = document.getElementById(label);
  if (!lab) return;
  if (isAuto(state[key])) lab.textContent = "AUTO";
  else if (key === "fstop") lab.textContent = "f/" + String(state[key]).replace(/^f\/?/i, "");
  else lab.textContent = state[key];
};
const paintAuto = () => {
  [["isoAuto", "iso"], ["isoFastAuto", "iso"], ["shutAuto", "shutter"], ["shutFastAuto", "shutter"],
   ["fAuto", "fstop"]].forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("on", isAuto(state[key]));
  });
};
const paintExposure = () => {
  syncDrag("isoDrag", ISO, "iso", "isoVal");
  syncDrag("isoFast", ISO, "iso", "isoFastVal");
  syncDrag("shutDrag", SHUT, "shutter", "shutVal");
  syncDrag("shutFast", SHUT, "shutter", "shutFastVal");
  syncDrag("fDrag", FSTOP, "fstop", "fVal");
  paintAuto();
};
const setAuto = (key) => {
  state[key] = "Auto";
  paintExposure();
  if (key === "iso" || key === "shutter") persistExposure();
  scheduleApply();
};
const bindDrag = (id, list, key, applyFast) => {
  const el = document.getElementById(id);
  if (!el) return;
  el.max = String(list.length - 1);
  el.oninput = () => {
    let i = parseInt(el.value, 10);
    if (i < 0) i = 0;
    if (i >= list.length) i = list.length - 1;
    state[key] = list[i];
    paintExposure();
    if (key === "iso" || key === "shutter") persistExposure();
    if (applyFast) scheduleApply();
  };
};
const fillSelect = (id, items, key) => {
  const el = document.getElementById(id);
  el.innerHTML = "";
  const rows = items.slice();
  if (state[key] && !rows.some(item => item[0] === state[key])) {
    rows.push([state[key], state[key]]);
  }
  rows.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item[0]; opt.textContent = item[1];
    if (item[0] === state[key]) opt.selected = true;
    el.appendChild(opt);
  });
  el.onchange = () => { state[key] = el.value; };
};
const roleOf = (row) => {
  if (row.serial && row.serial === state.t) return "T";
  if (row.serial && row.serial === state.r) return "R";
  if (row.role === "T" || row.role === "R") return row.role;
  return "";
};
const batPct = (s) => {
  const raw = String(s || "").trim();
  const m = raw.match(/(\d+)\s*%/);
  if (m) return Math.min(100, parseInt(m[1], 10));
  if (/^\d{1,3}$/.test(raw)) return Math.min(100, parseInt(raw, 10));
  const named = { full: 100, high: 80, normal: 50, medium: 50, low: 20, empty: 5, critical: 8 };
  const k = raw.toLowerCase();
  for (const name of Object.keys(named)) if (k.includes(name)) return named[name];
  return null;
};
const shortQual = (s) => {
  s = String(s || "");
  if (!s || /USB busy|ptpcamerad|\?/.test(s)) return "";
  return s.replace(/^JPEG\s+/i, "").replace(/\s*\(Raw\)/i, "").replace(/^NEF\+.*/i, "NEF+");
};
const shortEv = (s) => {
  s = String(s || "").trim();
  if (!s || /USB busy|ptpcamerad|\?/.test(s)) return "";
  if (s === "0" || s === "0.0" || s === "+0" || s === "0 EV") return "";
  return /[+-]/.test(s) ? s : ((parseFloat(s) > 0 ? "+" : "") + s);
};
const isFxModel = (m) =>
  /\bD8(00E?|10|50)\b|\bD6(00|10)\b|\bDf\b/i.test(
    String(m || "").replace(/^Nikon DSC /i, ""));
const paintBrand = () => {
  const fx = ["T", "R"].some((role) => {
    const s = state.stats[role];
    return s && s.on && isFxModel(s.model);
  }) || (state.rows || []).some((row) => isFxModel(row.model));
  const name = fx ? "FXPAN" : "D12600";
  const el = document.getElementById("brand");
  if (el) {
    el.textContent = name;
    el.classList.toggle("fx", fx);
  }
  document.title = name;
  const meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (meta) meta.content = name;
};
const paintHud = () => {
  ["T","R"].forEach(role => {
    const s = state.stats[role] || {};
    const el = document.getElementById("hud"+role);
    const autoFlag = /^on$/i.test(String(s.isoauto || "")) || /^on$/i.test(String(s.autoiso || ""));
    const isoNum = s.iso ? String(s.iso).replace(/^ISO\s+/i, "") : "";
    const iso = isAuto(s.iso) || (autoFlag && !/\d/.test(isoNum))
      ? "AUTO" : (isoNum || "—");
    const shut = s.shutterspeed || "—";
    const fnum = s["f-number"] ? String(s["f-number"]) : "";
    const mode = s.expprogram || "—";
    const wb = s.whitebalance || "—";
    const qual = shortQual(s.imagequality) || "—";
    const af = s.focusmode || s.focusmode2 || "";
    const ev = shortEv(s.exposurecompensation);
    const meter = s.meteringmode || "";
    const shots = String(s.availableshots || "").replace(/[^\d]/g, "");
    const bat = s.batterylevel || "";
    const pct = batPct(bat);
    const busy = bat && /USB busy|ptpcamerad|gphoto2/i.test(bat);
    el.classList.toggle("off", !s.on);
    el.classList.toggle("low", pct != null && pct <= 25 && s.on);
    el.querySelector(".hud-mode").textContent = s.on ? mode : "OUT";
    el.querySelector(".hud-iso").textContent = iso === "—" ? "ISO —" : iso === "AUTO" ? "ISO AUTO" : "ISO "+iso;
    el.querySelector(".hud-shut").textContent = fnum ? shut + "  " + fnum : shut;
    el.querySelector(".hud-wb").textContent = ev ? wb + "  " + ev : wb;
    el.querySelector(".hud-qual").textContent = qual;
    el.querySelector(".hud-af").textContent =
      [af, meter, s.serial ? "#" + shortSerial(s.serial) : ""].filter(Boolean).join(" · ") || "—";
    el.querySelector(".hud-bat i").style.width = (pct == null ? 0 : pct) + "%";
    el.querySelector(".hud-pct").textContent = !s.on ? "OUT" : (busy ? "USB" : (bat || "USB"));
    el.querySelector(".hud-shots").textContent = shots && !busy && s.on ? shots : "";
    const st = document.getElementById("st"+role);
    if (st) st.textContent = s.on
      ? [mode !== "—" ? mode : "", iso !== "—" ? iso : "", shut !== "—" ? shut : "", bat].filter(Boolean).join(" · ") || "USB"
      : "USB OUT";
  });
  paintBrand();
};
const ingestHud = (rows, blocks) => {
  if (rows) {
    const seen = new Set();
    rows.forEach(row => {
      const role = roleOf(row);
      if (!role) return;
      seen.add(role);
      const prev = state.stats[role] || {};
      state.stats[role] = Object.assign({}, prev, row, { role, on: true });
    });
    ["T","R"].forEach((role) => {
      if (!seen.has(role) && state.stats[role]) state.stats[role].on = false;
    });
  }
  (blocks || []).forEach(b => {
    let role = (b.role === "T" || b.role === "R") ? b.role : roleOf(b);
    if (!role && b.serialnumber) role = roleOf({ serial: b.serialnumber });
    if (role !== "T" && role !== "R") return;
    state.stats[role] = Object.assign({}, state.stats[role], b, { role, on: true });
  });
  paintHud();
};
const normShut = (s) => String(s || "").trim().replace(/\s+/g, "").replace(/s$/i, "").replace(/"$/, "");
const modeOwnsShutter = (m) => /^(M|S)$/i.test(String(m || "").trim());
const modeOwnsF = (m) => /^(M|A)$/i.test(String(m || "").trim());
const snapFromStatus = (b) => {
  if (b.iso && !isAuto(b.iso) && /\d/.test(String(b.iso)))
    state.iso = String(b.iso).replace(/^ISO\s+/i, "");
  else if (/^on$/i.test(String(b.isoauto || "")) || /^on$/i.test(String(b.autoiso || "")))

const composePano = () => {

  const t = document.getElementById("lvT");
  const r = document.getElementById("lvR");
  const canvas = document.getElementById("lvP");
  if (!canvas || !t.naturalWidth || !r.naturalWidth) return;
  const flip = flopOn();
  const ol = liveOverlap();
  const h = Math.min(t.naturalHeight, r.naturalHeight);
  const tw = Math.round(t.naturalWidth * h / t.naturalHeight);
  const rw = Math.round(r.naturalWidth * h / r.naturalHeight);
  const olPx = Math.max(8, Math.round(rw * ol));
  const seam = Math.max(1, rw - olPx);
  const width = seam + tw;
  if (canvas.width !== width || canvas.height !== h) {
    canvas.width = width;
    canvas.height = h;
  }
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, width, h);
  const left = document.createElement("canvas");
  left.width = rw;
  left.height = h;
  const lx = left.getContext("2d");
  lx.save();
  if (flip) {
    lx.translate(rw, 0);
    lx.scale(-1, 1);
  }
  lx.drawImage(r, 0, 0, r.naturalWidth, r.naturalHeight, 0, 0, rw, h);
  lx.restore();
  ctx.drawImage(left, 0, 0);
  const tmp = document.createElement("canvas");
  tmp.width = tw;
  tmp.height = h;
  const tx = tmp.getContext("2d");
  tx.drawImage(t, 0, 0, t.naturalWidth, t.naturalHeight, 0, 0, tw, h);

  tx.fillRect(0, 0, tw, h);
  ctx.drawImage(tmp, seam, 0);

  if (jp) jp.textContent = Math.round(ol * 100) + "%" + (flip ? " flop" : "");

const paintSettings = (s) => {
  if (!s) return;
  const dl = document.getElementById("dl");
  const g = document.getElementById("gpioOn");
  const flip = document.getElementById("flipR");
  const ol = document.getElementById("olDrag");
  if (dl && "download" in s) dl.checked = !!s.download;
  if (g && "gpio" in s) g.checked = !!s.gpio;
  if (flip && "flip_r" in s) flip.checked = !!s.flip_r;
  const dg = document.getElementById("deghostOn");
  if (dg && "deghost" in s) dg.checked = !!s.deghost;
  const bal = document.getElementById("balanceOn");
  if (bal && "balance" in s) bal.checked = !!s.balance;
  const fc = document.getElementById("followCam");
  if (fc && "follow_cam" in s) {
    fc.checked = !!s.follow_cam;
    state.followCam = !!s.follow_cam;
  }
  paintFlop();
  const sync = document.getElementById("syncOn");
  if (sync && "sync" in s) sync.checked = !!s.sync;
  const lock = document.getElementById("lockTOn");
  if (lock && "lock_t" in s) lock.checked = !!s.lock_t;
  const master = (s.master === "R") ? "R" : "T";
  const mt = document.getElementById("masterT");
  const mr = document.getElementById("masterR");
  if (mt) mt.classList.toggle("on", master === "T");
  if (mr) mr.classList.toggle("on", master === "R");
  if (ol && "overlap" in s) {
    const pct = Math.round((Number(s.overlap) || 0.20) * 100);
    ol.value = String(Math.min(50, Math.max(5, pct)));
    paintOl();
  }
  const prev = document.getElementById("prevDrag");
  if (prev && "preview_s" in s) {
    const n = Math.min(15, Math.max(0, parseInt(s.preview_s, 10) || 0));
    prev.value = String(n);
    state.previewS = n;
    paintPrev();
  }
  const idle = document.getElementById("idleDrag");
  if (idle && "idle_min" in s) {
    const n = Math.min(60, Math.max(0, parseInt(s.idle_min, 10) || 0));
    idle.value = String(n);
    state.idleMin = n;
    paintIdle();
    armIdle();
  }
};
const saveSettings = async () => {
  const j = await api("/api/settings", { method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({

      flip_r: document.getElementById("flipR").checked,
      deghost: document.getElementById("deghostOn").checked,

      sync: document.getElementById("syncOn").checked,

    }) });

  log(j.message);
};

const paintLink = (j) => {
  if (!j || !j.roles) return;
  const rows = [];
  ["T","R"].forEach((role) => {
    const r = j.roles[role] || {};
    const fig = document.querySelector(".previews figure." + role.toLowerCase());
    if (fig) fig.classList.toggle("out", !r.online);
    const prev = state.stats[role] || {};
    const hud = (j.status || {})[role] || {};
    const keep = {};
    Object.keys(hud).forEach((k) => {
      if (hud[k] !== "" && hud[k] != null) keep[k] = hud[k];
    });
    const on = !!r.online;
    state.stats[role] = Object.assign({}, prev, keep, {
      on,
      serial: r.serial || keep.serial || prev.serial,
      port: r.port || keep.port || prev.port || "",
      model: r.model || keep.model || prev.model,
      role,
    });
    if (!on) state.stats[role].on = false;
    if (r.serial || r.port) {
      const old = (state.rows || []).find(x => x.role === role) || {};
      rows.push({
        role, serial: r.serial || old.serial, port: r.port || "",
        model: r.model || old.model, batterylevel: old.batterylevel,
      });
    }
  });
  (j.extras || []).forEach((row) => {
    if (!row || !row.port) return;
    if (rows.some(x => x.port === row.port || (row.serial && x.serial === row.serial)))
      return;
    rows.push({
      role: row.role || "", serial: row.serial || "",
      port: row.port, model: row.model || "",
    });
  });
  if (rows.length) {
    state.rows = rows;
    paintCams();
  }
  paintHud();
  if (state.followCam) {
    ["T","R"].forEach((role) => {
      if (state.stats[role] && state.stats[role].on) snapFromStatus(state.stats[role]);
    });
  }
  if (j.message && j.message !== state.linkMsg) {
    state.linkMsg = j.message;
    if (/out|gone|dead|waiting|missing|stall/i.test(j.message))
      log(j.message, !!(j.missing && j.missing.length));
  }
  if (j.want_live && j.running && !state.live) setLiveSrc(true);
  if (!j.want_live && state.live) setLiveSrc(false);
  if (j.running) state.liveOk = true;
  else if (!j.want_live) state.liveOk = false;
  paintLiveBtn();
};
let linkTimer = 0;
let linkMs = 1500;
let idleTimer = 0;
const pollLink = () => {
  api("/api/link").then(paintLink).catch(() => {});
};
const startLinkPoll = (ms) => {
  if (ms) linkMs = ms;
  if (linkTimer) {
    clearInterval(linkTimer);
    linkTimer = 0;
  }
  pollLink();
  linkTimer = setInterval(pollLink, linkMs);
};
const armIdle = () => {
  clearTimeout(idleTimer);
  idleTimer = 0;
  const m = state.idleMin || 0;
  if (!m || state.idle) return;
  idleTimer = setTimeout(goIdle, m * 60000);
};
const goIdle = async () => {
  if (state.idle) return;
  state.idle = true;
  if (state.liveOk || state.live) {
    setLiveSrc(false);
    try { await api("/api/live/stop", { method: "POST" }); }
    catch (e) {}
  }
  startLinkPoll(15000);
  api("/api/idle", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ idle: true }),
  }).catch(() => {});
  log("idle  live off  slow poll");
  paintLiveBtn();
};
const wakeIdle = () => {
  if (!state.idle) {
    armIdle();
    return;
  }
  state.idle = false;
  startLinkPoll(1500);
  api("/api/idle", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ idle: false }),
  }).catch(() => {});
  armIdle();
};
["pointerdown", "keydown"].forEach((ev) => {
  document.addEventListener(ev, () => wakeIdle(), { passive: true });
});
api("/api/meta").then(j => {

  paintGpio(j.gpio);

      if (key === "fstop") val = val.replace(/^f\/?/i, "");
      state[key] = val;
    });
    paintExposure();
    fillSelect("program", PROG, "program");
    fillSelect("wb", WB, "wb");
    fillSelect("quality", QUAL, "quality");
  }
  if (j.link) paintLink(j.link);
  startLinkPoll();
}).catch(() => { startLinkPoll(); });
