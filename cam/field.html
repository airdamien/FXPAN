<title>NERV · DUALS</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080809;
    --ink: #f3ead2;
    --dim: #8a7a55;
    --line: #ff6a00;
    --t: #9a5cff;
    --r: #ff6a00;
    --fire: #d4000d;
    --ok: #6cff4d;
    --pad: max(14px, env(safe-area-inset-left));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.3 Futura, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Helvetica Neue", sans-serif;
    padding: env(safe-area-inset-top) var(--pad) 0;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    touch-action: manipulation;
    background:
      linear-gradient(rgba(255,106,0,.04), transparent 28%),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,106,0,.035) 3px 4px),
      var(--bg);
  }
  body.live .pulse { color: var(--ok); }
  header {
    display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 8px;
    align-items: end; padding: 12px 0 10px;
  }
  .nerv {
    background: var(--fire); color: #fff; font: 800 11px/1 Futura, sans-serif;
    letter-spacing: 0.22em; padding: 7px 8px 6px; clip-path: polygon(0 0, 100% 0, 100% 70%, 82% 100%, 0 100%);
  }
  header h1 {
    margin: 0; font-size: 15px; letter-spacing: 0.34em; font-weight: 700;
  }
  header h1 small { display: block; color: var(--dim); letter-spacing: 0.42em; font-size: 9px; }
  header a { color: var(--r); font-size: 11px; letter-spacing: 0.2em; text-decoration: none; }
  #host, .pulse { color: var(--r); font-size: 11px; letter-spacing: 0.08em; }
  .hazard {
    height: 7px; margin: 0 calc(-1 * var(--pad));
    background: repeating-linear-gradient(-45deg, #111 0 9px, #f0c000 9px 18px);
  }
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0;
    margin: 0 calc(-1 * var(--pad));
  }
  .tabs button {
    clip-path: none; border: 0; border-bottom: 3px solid transparent;
    letter-spacing: 0.12em; background: #0c0c0d; font-size: 12px;
  }
  .tabs button.on { border-bottom-color: var(--r); color: var(--r); background: #1a0e04; }
  .pane[hidden] { display: none !important; }
  .previews {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 10px;
  }
  figure {
    margin: 0; position: relative; background: #000;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    outline: 1px solid var(--line); outline-offset: -1px;
  }
  figure img { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; background: #000; }
  figure::after {
    content: ""; pointer-events: none; position: absolute; inset: 0;
    background:
      linear-gradient(transparent 49.4%, rgba(255,106,0,.45) 49.4% 50.6%, transparent 50.6%),
      linear-gradient(90deg, transparent 49.4%, rgba(255,106,0,.45) 49.4% 50.6%, transparent 50.6%),
      repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.2) 2px 3px);
  }
  figure .tag {
    position: absolute; top: 6px; left: 8px; z-index: 1;
    font: 800 20px/1 Futura, sans-serif; letter-spacing: 0.08em;
    text-shadow: 0 0 8px currentColor;
  }
  figure .jp {
    position: absolute; top: 8px; right: 8px; z-index: 1;
    font-size: 10px; letter-spacing: 0.18em; opacity: 0.85;
  }
  figure .meta {
    position: absolute; left: 7px; bottom: 7px; right: 7px; z-index: 1;
    font-size: 10px; letter-spacing: 0.12em; text-shadow: 0 1px 3px #000;
    display: flex; justify-content: space-between;
  }
  .t { outline-color: var(--t); }
  .t .tag, .t .meta, .t .jp { color: var(--t); }
  .r .tag, .r .meta, .r .jp { color: var(--r); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  button, .chip {
    appearance: none; border: 1px solid var(--r); background: #120c08; color: var(--ink);
    font: 700 13px/1.1 Futura, "Hiragino Sans", sans-serif; letter-spacing: 0.14em;
    min-height: 44px; padding: 0 12px;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  button:active, .chip.on { background: #3a1600; color: var(--r); }
  button:disabled { opacity: 0.4; }
  .chip { min-width: 52px; text-align: center; }
  .lbl { width: 100%; color: var(--dim); font-size: 10px; letter-spacing: 0.22em;
         text-transform: uppercase; margin: 12px 0 4px; }
  .drag { margin: 10px 0 4px; }
  .drag .k {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--dim); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  }
  .drag .k b { color: var(--r); font-size: 24px; letter-spacing: 0.04em; font-weight: 700; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 44px;
    background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; background: #3a2208;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px;
    background: var(--r); margin-top: -10px; border: 0;
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  }
  .picks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 10px 0; }
  .picks.two { grid-template-columns: 1fr 1fr; }
  .picks label { display: flex; flex-direction: column; gap: 5px; color: var(--dim);
                 font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; }
  select {
    font: 16px/1.2 inherit; min-height: 44px; padding: 0 10px;
    background: #120c08; color: var(--ink); border: 1px solid var(--r);
  }
  #cams { display: grid; gap: 8px; }
  .cam {
    border: 1px solid #5a3200; padding: 10px 12px;
    display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .cam b { font-size: 13px; letter-spacing: 0.08em; }
  .cam span { display: block; color: var(--dim); font-size: 12px; }
  #log {
    margin: 10px 0 0; color: var(--ok); font: 12px/1.4 "Share Tech Mono", ui-monospace, Menlo, monospace;
    white-space: pre-wrap; min-height: 2.6em;
  }
  #log.err { color: #ff3b3b; }
  .fire {
    display: flex; align-items: center; gap: 8px; margin: 10px 0 14px;
  }
  .fire .acts { display: flex; gap: 8px; flex: 1; }
  .dlchk {
    display: flex; align-items: center; gap: 7px; margin-left: auto;
    color: var(--dim); font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; min-height: 44px; white-space: nowrap;
  }
  .dlchk input {
    appearance: none; -webkit-appearance: none;
    width: 22px; height: 22px; margin: 0;
    border: 1px solid var(--r); background: #120c08;
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  }
  .dlchk input:checked { background: var(--r); }
  .dlchk:has(input:checked) { color: var(--r); }
  #shoot {
    background: var(--fire); border-color: #ff2a2a; color: #fff;
    font-size: 22px; letter-spacing: 0.28em; font-weight: 800;
    min-height: 68px; min-width: 42%;
  }
  #pairs { display: grid; gap: 10px; margin: 10px 0; }
  .pair {
    display: grid; gap: 6px; width: 100%; padding: 8px; text-align: left;
    border: 1px solid #5a3200;
  }
  .pair-frames {
    display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 6px; align-items: start;
  }
  .pair-frames figure { margin: 0; }
  .pair-frames figcaption { color: var(--dim); font-size: 10px; letter-spacing: 0.12em; }
  .pair img { width: 100%; aspect-ratio: 3/2; object-fit: cover; background: #000; }
  .pair-pano img { aspect-ratio: 16/6; object-fit: contain; }
  .pair-stat {
    color: var(--ok); font: 12px/1.35 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; min-height: 2.6em;
  }
  .pair-stat.err { color: #ff3b3b; }
  .pair-stat.run { color: var(--r); }
  .pair-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pair-acts .who { color: var(--dim); font-size: 11px; letter-spacing: 0.1em; }
  .file {
    display: grid; gap: 8px; padding: 10px;
    border: 1px solid #5a3200;
  }
  .file .thumbs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .file img { width: 100%; aspect-ratio: 3/2; object-fit: cover; background: #000; }
  .file .who { color: var(--dim); font-size: 10px; letter-spacing: 0.14em; }
  .file .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .hud {
    position: sticky; top: 0; z-index: 5;
    display: grid; grid-template-columns: 1fr 1fr;
    margin: 0 calc(-1 * var(--pad));
    background: #0c0c0d; border-bottom: 1px solid #5a3200;
  }
  .hud-cam {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; min-height: 48px;
  }
  .hud-cam.t { border-right: 1px solid #3a2208; }
  .hud-cam b {
    font: 800 20px/1 Futura, sans-serif; letter-spacing: 0.08em; min-width: 1.1em;
  }
  .hud-cam.t b { color: var(--t); }
  .hud-cam.r b { color: var(--r); }
  .hud-mid { flex: 1; min-width: 0; }
  .hud-line {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 12px; letter-spacing: 0.06em;
  }
  .hud-sub { color: var(--dim); font-size: 10px; letter-spacing: 0.08em; margin-top: 2px; }
  .hud-pwr {
    display: flex; align-items: center; gap: 6px; margin-top: 5px;
  }
  .hud-ico {
    flex: 0 0 auto; width: 14px; height: 8px; box-sizing: border-box;
    border: 1px solid currentColor; color: var(--dim); position: relative;
  }
  .hud-ico::after {
    content: ""; position: absolute; right: -3px; top: 1px;
    width: 2px; height: 4px; background: currentColor;
  }
  .hud-bat {
    flex: 1; min-width: 0; height: 5px; background: #2a1a08; overflow: hidden;
  }
  .hud-bat i { display: block; height: 100%; width: 0; background: var(--ok); }
  .hud-pct { color: var(--dim); font-size: 11px; letter-spacing: 0.08em; white-space: nowrap; }
  .hud-shots { color: var(--dim); font-size: 10px; letter-spacing: 0.06em; white-space: nowrap; }
  .hud-shots:empty { display: none; }
  .hud-cam.low .hud-bat i { background: var(--fire); }
  .hud-cam.low .hud-ico, .hud-cam.low .hud-pct { color: var(--fire); }
  .hud-cam.off { opacity: 0.35; }
</style>
<div class="hud" id="hud">

      <div class="hud-pwr">

</div>

<script>
const ISO = ["100","125","160","200","250","320","400","500","640","800","1000","1250",
  "1600","2000","2500","3200","4000","5000","6400","12800","25600"];
const SHUT = ["30","20","15","10","8","6","4","3","2","1.6","1.3","1","0.8","0.6","0.5",
  "1/3","1/4","1/5","1/6","1/8","1/10","1/13","1/15","1/20","1/25","1/30","1/40","1/50",
  "1/60","1/80","1/100","1/125","1/160","1/200","1/250","1/320","1/400","1/500","1/640",
  "1/800","1/1000","1/1250","1/1600","1/2000","1/2500","1/3200","1/4000","1/5000","1/6400","1/8000"];
const WB = [["Auto","Auto"],["Sunny","Sunny"],["Cloudy","Cloudy"],["Flash","Flash"],
  ["Tungsten","Tungsten"],["Fluorescent","Fluor"],["Shade","Shade"]];
const QUAL = [["JPEG Fine","JPEG Fine"],["JPEG Normal","JPEG Norm"],
  ["NEF+Fine","NEF+Fine"],["NEF (Raw)","NEF"]];
const PROG = [["M","M"],["A","A"],["S","S"],["P","P"],["Auto","Auto"]];
const state = { iso:"400", shutter:"1/125", wb:"Auto", quality:"JPEG Fine", program:"M",
  t:"", r:"", live:false, timer:0, stamp:"", rows:[],
  stats: { T: { on: false }, R: { on: false } } };
const log = (m, err) => { const el = document.getElementById("log");
  el.textContent = m; el.className = err ? "err" : ""; };
const api = async (path, opt) => {
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const idxOf = (list, val) => {
  const s = String(val || "").replace(/^ISO\s+/i, "").trim();
  return list.findIndex(v => v === s || v === val);
};
const bindDrag = (id, list, key, label) => {
  const el = document.getElementById(id);
  el.max = String(list.length - 1);
  const paint = () => {
    let i = parseInt(el.value, 10);
    if (i < 0) i = 0;
    if (i >= list.length) i = list.length - 1;
    state[key] = list[i];
    document.getElementById(label).textContent = list[i];
  };
  el.oninput = paint;
  const i = idxOf(list, state[key]);
  if (i >= 0) el.value = String(i);
  paint();
};
const fillSelect = (id, items, key) => {
  const el = document.getElementById(id);
  el.innerHTML = "";
  const rows = items.slice();
  if (state[key] && !rows.some(item => item[0] === state[key])) {
    rows.push([state[key], state[key]]);
  }
  rows.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item[0]; opt.textContent = item[1];
    if (item[0] === state[key]) opt.selected = true;
    el.appendChild(opt);
  });
  el.onchange = () => { state[key] = el.value; };
};
const roleOf = (row) => {
  if (row.serial && row.serial === state.t) return "T";
  if (row.serial && row.serial === state.r) return "R";
  if (row.role === "T" || row.role === "R") return row.role;
  return "";
};
const batPct = (s) => {
  const m = String(s || "").match(/(\d+)\s*%/);
  if (m) return Math.min(100, parseInt(m[1], 10));
  const named = { full: 100, high: 80, normal: 50, medium: 50, low: 20, empty: 5, critical: 8 };
  const k = String(s || "").toLowerCase();
  for (const name of Object.keys(named)) if (k.includes(name)) return named[name];
  return null;
};
const shortQual = (s) => {
  s = String(s || "");
  if (!s || /USB busy|ptpcamerad|\?/.test(s)) return "";
  return s.replace(/^JPEG\s+/i, "").replace(/\s*\(Raw\)/i, "").replace(/^NEF\+.*/i, "NEF+");
};
const shortEv = (s) => {
  s = String(s || "").trim();
  if (!s || /USB busy|ptpcamerad|\?/.test(s)) return "";
  if (s === "0" || s === "0.0" || s === "+0" || s === "0 EV") return "";
  return /[+-]/.test(s) ? s : ((parseFloat(s) > 0 ? "+" : "") + s);
};
const paintHud = () => {
  ["T","R"].forEach(role => {
    const s = state.stats[role] || {};
    const el = document.getElementById("hud"+role);
    const iso = s.iso ? String(s.iso).replace(/^ISO\s+/i, "") : "—";
    const shut = s.shutterspeed || "—";
    const mode = s.expprogram || "—";
    const wb = s.whitebalance || "—";
    const qual = shortQual(s.imagequality) || "—";
    const af = s.focusmode || s.focusmode2 || "";
    const ev = shortEv(s.exposurecompensation);
    const meter = s.meteringmode || "";
    const shots = String(s.availableshots || "").replace(/[^\d]/g, "");
    const bat = s.batterylevel || "";
    const pct = batPct(bat);
    const busy = bat && /USB busy|ptpcamerad|gphoto2/i.test(bat);
    el.classList.toggle("off", !s.on);
    el.classList.toggle("low", pct != null && pct <= 25);
    el.querySelector(".hud-mode").textContent = mode;
    el.querySelector(".hud-iso").textContent = iso === "—" ? "ISO —" : "ISO "+iso;
    el.querySelector(".hud-shut").textContent = shut;
    el.querySelector(".hud-wb").textContent = ev ? wb + "  " + ev : wb;
    el.querySelector(".hud-qual").textContent = qual;
    el.querySelector(".hud-af").textContent = [af, meter].filter(Boolean).join(" · ") || "—";
    el.querySelector(".hud-bat i").style.width = (pct == null ? 0 : pct) + "%";
    el.querySelector(".hud-pct").textContent = busy ? "USB" : (bat || (s.on ? "USB" : "—"));
    el.querySelector(".hud-shots").textContent = shots && !busy ? shots : "";
    const st = document.getElementById("st"+role);
    if (st) st.textContent = s.on
      ? [mode !== "—" ? mode : "", iso !== "—" ? iso : "", shut !== "—" ? shut : "", bat].filter(Boolean).join(" · ") || "USB"
      : "—";
  });
};
const ingestHud = (rows, blocks) => {
  if (rows) {
    state.stats = { T: { on: false }, R: { on: false } };
    rows.forEach(row => {
      const role = roleOf(row);
      if (role) state.stats[role] = Object.assign({}, row, { role, on: true });
    });
  }
  (blocks || []).forEach(b => {
    if (b.role !== "T" && b.role !== "R") return;
    state.stats[b.role] = Object.assign({}, state.stats[b.role], b, { role: b.role, on: true });
  });
  paintHud();
};
const normShut = (s) => String(s || "").trim().replace(/\s+/g, "").replace(/s$/i, "").replace(/"$/, "");
const modeOwnsShutter = (m) => /^(M|S)$/i.test(String(m || "").trim());
const snapFromStatus = (b) => {
  if (b.iso) { state.iso = String(b.iso).replace(/^ISO\s+/i, ""); bindDrag("isoDrag", ISO, "iso", "isoVal"); }
  if (b.shutterspeed && modeOwnsShutter(b.expprogram)) {
    const shut = normShut(b.shutterspeed);
    if (idxOf(SHUT, shut) >= 0) {
      state.shutter = shut;
      bindDrag("shutDrag", SHUT, "shutter", "shutVal");
    }
  }
  if (b.whitebalance) { state.wb = b.whitebalance; fillSelect("wb", WB, "wb"); }
  if (b.imagequality) { state.quality = b.imagequality; fillSelect("quality", QUAL, "quality"); }
  if (b.expprogram) { state.program = b.expprogram; fillSelect("program", PROG, "program"); }
};
const camLabel = (row) => {
  const model = (row.model || "camera").replace(/^Nikon DSC /, "");
  return model + " · " + (row.port || "USB");
};
const fillPicks = (rows) => {
  ["T","R"].forEach(role => {
    const el = document.getElementById("pick"+role);
    const cur = state[role.toLowerCase()];
    el.innerHTML = '<option value="">—</option>';
    (rows || []).forEach(row => {
      if (!row.serial) return;
      const opt = document.createElement("option");
      opt.value = row.serial;
      opt.textContent = camLabel(row);
      if (row.serial === cur) opt.selected = true;
      el.appendChild(opt);
    });
    if (cur && ![...el.options].some(o => o.value === cur)) {
      const opt = document.createElement("option");
      opt.value = cur;
      opt.textContent = "saved · offline";
      opt.selected = true;
      el.appendChild(opt);
    }
    el.onchange = () => pickRole(role).catch(e => log(e.message, true));
  });
};
const fill = (rows, pair) => {
  state.rows = rows || [];
  pair = pair || {};
  if (pair.T) state.t = pair.T;
  if (pair.R) state.r = pair.R;
  (rows || []).forEach(row => {
    if (row.role === "T" && row.serial) state.t = row.serial;
    if (row.role === "R" && row.serial) state.r = row.serial;
  });
  fillPicks(rows);
  const box = document.getElementById("cams");
  box.innerHTML = "";
  (rows || []).forEach(row => {
    const who = (row.serial && row.serial === state.t) ? "T"
      : (row.serial && row.serial === state.r) ? "R"
      : (row.role || "—");
    const el = document.createElement("div");
    el.className = "cam";
    el.innerHTML = `<div><b>${who}  ${row.model || "camera"}</b>
      <span>${row.port || ""}  ${row.batterylevel || row.iso || ""}</span></div>`;
    box.appendChild(el);
    const st = document.getElementById("st"+who);
    if (st) st.textContent = (row.batterylevel || row.iso || "USB");
  });
  if (!(rows || []).length) {
    box.innerHTML = "<div class='cam'><div><b>NO BODIES</b><span>MTP/PTP · wake · plug USB</span></div></div>";
  }
  ingestHud(rows);
};
const pickRole = async (role) => {
  state.t = document.getElementById("pickT").value;
  state.r = document.getElementById("pickR").value;
  if (state.t && state.t === state.r) {
    if (role === "T") state.r = "";
    else state.t = "";
  }
  if (!state.t && !state.r) {
    fillPicks(state.rows);
    log("pick T or R");
    return;
  }
  const j = await api("/api/pair", { method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({ t: state.t, r: state.r }) });
  log(j.message);
  fill(state.rows, { T: state.t, R: state.r });
};
const bind = (id, fn) => {
  document.getElementById(id).onclick = async () => {
    const b = document.getElementById(id);
    b.disabled = true;
    try { await fn(); } catch (e) { log(e.message, true); }
    b.disabled = false;
  };
};
const setLiveSrc = (on) => {
  state.live = on;
  document.body.classList.toggle("live", on);
  const sync = document.getElementById("sync");
  if (sync) sync.textContent = on ? "ACTIVE" : "STANDBY";
  if (state.timer) { clearTimeout(state.timer); state.timer = 0; }
  if (!on) {
    ["T","R"].forEach(role => { document.getElementById("lv"+role).src = ""; });
    return;
  }
  const tick = async () => {
    if (!state.live) return;
    for (const role of ["T","R"]) {
      try {
        const r = await fetch("/api/live/"+role+".jpg", { cache:"no-store" });
        if (r.ok && (r.headers.get("content-type") || "").includes("jpeg")) {
          const url = URL.createObjectURL(await r.blob());
          const img = document.getElementById("lv"+role);
          const old = img.src;
          img.src = url;
          if (old.startsWith("blob:")) URL.revokeObjectURL(old);
        }
      } catch (e) {}
    }
    state.timer = setTimeout(tick, 280);
  };
  tick();
};
const usb = async (fn) => {
  const was = state.live;
  setLiveSrc(false);
  try { return await fn(); }
  finally { if (was) {
    try { await api("/api/live/start", { method:"POST" }); setLiveSrc(true); }
    catch (e) { log(e.message, true); }
  } }
};
bind("detect", async () => {
  const was = state.live; setLiveSrc(false);
  const j = await api("/api/detect"); fill(j.cameras, j.pair); log(j.message);
  if (was) { await api("/api/live/start", { method:"POST" }); setLiveSrc(true); }
});
bind("status", async () => { await usb(async () => {
  const j = await api("/api/status"); fill(j.cameras, j.pair); log(j.message);
  ingestHud(j.cameras, j.status);
  (j.status || []).forEach(b => {
    if (b.role === "T" || b.role === "R") snapFromStatus(b);
  });
}); });
bind("set", async () => { await usb(async () => {
  const j = await api("/api/set", { method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({ iso: state.iso, shutter: state.shutter,
      program: state.program, wb: state.wb, quality: state.quality }) });
  ["T","R"].forEach(role => {
    if (state.stats[role] && state.stats[role].on) {
      state.stats[role].iso = state.iso;
      state.stats[role].shutterspeed = state.shutter;
      state.stats[role].expprogram = state.program;
      state.stats[role].whitebalance = state.wb;
      state.stats[role].imagequality = state.quality;
    }
  });
  paintHud();
  log(j.message);
}); });
const fire = (target) => usb(async () => {
  const j = await api("/api/shoot", { method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({ target }) });
  log(j.message);
});
const shootTarget = () => document.getElementById("dl").checked ? "download" : "card";
const paintShoot = () => {
  document.getElementById("shoot").textContent =
    document.getElementById("dl").checked ? "回収 FIRE" : "射撃 FIRE";
};
document.getElementById("dl").onchange = paintShoot;
bind("shoot", () => fire(shootTarget()));
bind("live", async () => {
  const j = await api("/api/live/start", { method:"POST" });
  setLiveSrc(true); log(j.message);
});
bind("liveStop", async () => {
  setLiveSrc(false);
  const j = await api("/api/live/stop", { method:"POST" }); log(j.message);
});
const stitchLine = (p) => {
  const s = p.stitch || {};
  if (s.running) return (s.message || "stitching…") + (s.log && s.log.length > 1 ? "\n" + s.log.slice(-3).join("\n") : "");
  if (s.error) return s.error;
  if (s.message) return s.message;
  if (p.pano) return "stitched  " + p.pano;
  return p.ready ? "ready  pick Match / Blend / Cut" : "need T and R";
};
const paintPairStat = (el, p) => {
  const s = p.stitch || {};
  el.textContent = stitchLine(p);
  el.className = "pair-stat" + (s.running ? " run" : s.error ? " err" : "");
};
let panoTimer = 0;
const loadPairs = async (silent) => {
  const j = await api("/api/captures");
  const box = document.getElementById("pairs");
  const seen = new Set();
  (j.pairs || []).forEach(p => {
    seen.add(p.stamp);
    let el = box.querySelector(`[data-stamp="${p.stamp}"]`);
    if (!el) {
      el = document.createElement("div");
      el.className = "pair";
      el.dataset.stamp = p.stamp;
      el.innerHTML = `<div class="pair-frames">
          <figure><figcaption>T</figcaption><img class="pt" alt="T"></figure>
          <figure><figcaption>R</figcaption><img class="pr" alt="R"></figure>
          <figure class="pair-pano"><figcaption>PANO</figcaption><img class="pp" alt="P"></figure>
        </div>
        <div class="pair-stat"></div>
        <div class="pair-acts"><button type="button" class="go">結合 STITCH</button>
          <span class="who">${p.stamp}</span></div>`;
      el.querySelector(".go").onclick = () => startPano(p.stamp).catch(e => {
        el.querySelector(".pair-stat").className = "pair-stat err";
        el.querySelector(".pair-stat").textContent = e.message;
        log(e.message, true);
      });
      box.appendChild(el);
    }
    const setImg = (sel, name, w) => {
      const img = el.querySelector(sel);
      if (!name) { img.removeAttribute("src"); return; }
      const next = "/api/file/"+encodeURIComponent(name)+"?w="+w;
      if (!img.src.includes(encodeURIComponent(name))) img.src = next + "&t="+Date.now();
      else if ((p.stitch || {}).phase === "done") img.src = next + "&t="+Date.now();
    };
    setImg(".pt", p.t, 240);
    setImg(".pr", p.r, 240);
    setImg(".pp", p.pano, 720);
    el.querySelector(".go").disabled = !p.ready || !!(p.stitch && p.stitch.running);
    paintPairStat(el.querySelector(".pair-stat"), p);
  });
  [...box.querySelectorAll(".pair")].forEach(el => {
    if (!seen.has(el.dataset.stamp)) el.remove();
  });
  if (!(j.pairs || []).length) {
    if (!box.querySelector(".cam"))
      box.innerHTML = "<div class='cam'><div><b>NO PAIRS</b><span>回収 FIRE writes T_/R_ JPEGs</span></div></div>";
  } else {
    const empty = box.querySelector(":scope > .cam");
    if (empty) empty.remove();
  }
  const busy = (j.pairs || []).some(p => p.stitch && p.stitch.running);
  if (busy && !panoTimer) panoTimer = setInterval(() => loadPairs(true).catch(() => {}), 700);
  if (!busy && panoTimer) { clearInterval(panoTimer); panoTimer = 0; }
  if (!silent) log(j.message);
};
const startPano = async (stamp) => {
  state.stamp = stamp;
  const j = await api("/api/pano", { method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({ stamp,
      mode: document.getElementById("panoMode").value,
      overlap: parseInt(document.getElementById("olDrag").value, 10) / 100,
      flip_r: document.getElementById("flipR").checked }) });
  log(j.message);
  await loadPairs(true);
};
const paintOl = () => {
  document.getElementById("olVal").textContent = document.getElementById("olDrag").value + "%";
};
document.getElementById("olDrag").oninput = paintOl;
bind("panoRefresh", () => loadPairs());
const fileThumb = (name, label) => name
  ? `<img alt="${label}" src="/api/file/${encodeURIComponent(name)}?w=240">`
  : `<span class="who">${label} —</span>`;
const loadFiles = async (pairs, message) => {
  let rows = pairs;
  if (!rows) {
    const j = await api("/api/captures");
    rows = j.pairs || [];
    if (message == null) message = j.message;
  }
  const box = document.getElementById("files");
  box.innerHTML = "";
  (rows || []).forEach(p => {
    const el = document.createElement("div");
    el.className = "file";
    el.innerHTML = `<div class="thumbs">${fileThumb(p.t,"T")}${fileThumb(p.r,"R")}${fileThumb(p.pano,"P")}</div>
      <span class="who">${p.stamp}${p.ready ? "" : " · 欠"}</span>
      <div class="acts"></div>`;
    const acts = el.querySelector(".acts");
    [["T","T"],["R","R"],["P","P"],["","全削除"]].forEach(([side, label]) => {
      if (side === "T" && !p.t) return;
      if (side === "R" && !p.r) return;
      if (side === "P" && !p.pano) return;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "削除 " + label;
      b.onclick = async () => {
        try {
          const j = await api("/api/captures/delete", { method:"POST",
            headers:{"content-type":"application/json"},
            body: JSON.stringify({ stamp: p.stamp, side }) });
          log(j.message);
          await loadFiles(j.pairs, j.message);
          if (document.getElementById("tab-pano") && !document.getElementById("tab-pano").hidden)
            await loadPairs();
        } catch (e) { log(e.message, true); }
      };
      acts.appendChild(b);
    });
    box.appendChild(el);
  });
  if (!(rows || []).length) {
    box.innerHTML = "<div class='cam'><div><b>NO FILES</b><span>captures/ is empty</span></div></div>";
  }
  if (message) log(message);
};
const filesPost = (path, body, warn) => async () => {
  if (warn && !confirm(warn)) return;
  const j = await api(path, { method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify(body || {}) });
  log(j.message);
  await loadFiles(j.pairs, j.message);
};
bind("filesRefresh", () => loadFiles());
bind("filesToday", filesPost("/api/captures/before-today", {}, "Delete every capture from before today?"));
bind("filesKeep5", filesPost("/api/captures/keep-last", { n: 5 }, "Keep only the 5 newest captures?"));
const showTab = (name) => {
  document.querySelectorAll(".tabs [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  document.getElementById("tab-view").hidden = name !== "view";
  document.getElementById("tab-usb").hidden = name !== "usb";
  document.getElementById("tab-pano").hidden = name !== "pano";
  document.getElementById("tab-files").hidden = name !== "files";
  if (name === "pano") loadPairs().catch(e => log(e.message, true));
  if (name === "files") loadFiles().catch(e => log(e.message, true));
};
document.querySelectorAll(".tabs [data-tab]").forEach(b => {
  b.onclick = () => showTab(b.dataset.tab);
});
showTab(location.hash === "#usb" ? "usb" : location.hash === "#pano" ? "pano"
  : location.hash === "#files" ? "files" : "view");
bindDrag("isoDrag", ISO, "iso", "isoVal");
bindDrag("shutDrag", SHUT, "shutter", "shutVal");
fillSelect("program", PROG, "program");
fillSelect("wb", WB, "wb");
fillSelect("quality", QUAL, "quality");
if (navigator.wakeLock) {
  const lock = () => navigator.wakeLock.request("screen").catch(() => {});
  lock(); document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") lock();
  });
}
api("/api/meta").then(j => {
  document.getElementById("host").textContent = (j.phone || "").replace("http://","");
}).catch(() => {});
api("/api/detect").then(async j => {
  fill(j.cameras, j.pair); log(j.message);
  if ((j.cameras || []).length) {
    const s = await api("/api/status");
    fill(s.cameras, s.pair);
    ingestHud(s.cameras, s.status);
    (s.status || []).forEach(b => {
      if (b.role === "T" || b.role === "R") snapFromStatus(b);
    });
  }
}).catch(e => log(e.message, true));
</script>
