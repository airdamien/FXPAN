<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAGI · lab</title>
<style>
  :root { color-scheme: dark; }
  body {
    font: 15px/1.4 Futura, "Hiragino Kaku Gothic ProN", "Helvetica Neue", sans-serif;
    margin: 0 auto; padding: 1.4rem 1.6rem 2rem; max-width: 64rem;
    background:
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,106,0,.04) 3px 4px),
      #080809;
    color: #f3ead2;
  }
  .nerv {
    display: inline-block; background: #d4000d; color: #fff;
    font: 800 11px/1 Futura, sans-serif; letter-spacing: 0.22em;
    padding: 6px 8px 5px; margin-right: 10px;
  }
  .previews { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .previews figure { margin: 0; position: relative; background: #000;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    outline: 1px solid #ff6a00; }
  .previews figcaption { color: #ff6a00; font-size: 0.75rem; letter-spacing: 0.16em; margin: 0 0 0.35rem; }
  .previews img { width: 100%; aspect-ratio: 3/2; object-fit: contain; display: block; background: #000; }
  h1 { font-size: 1.15rem; letter-spacing: 0.28em; font-weight: 700; margin: 0 0 0.25rem; }
  p.sub { color: #8a7a55; margin: 0 0 1.2rem; letter-spacing: 0.06em; }
  a { color: #ff6a00; }
  .hazard { height: 7px; margin: 0 0 1rem;
    background: repeating-linear-gradient(-45deg, #111 0 9px, #f0c000 9px 18px); }
  section { border: 1px solid #5a3200; padding: 1rem 1.1rem; margin: 0 0 1rem;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #3a2208; }
  th { color: #8a7a55; font-weight: 500; letter-spacing: 0.12em; }
  input, select { background: #120c08; color: #f3ead2; border: 1px solid #ff6a00;
          padding: 0.35rem 0.5rem; font-size: 16px; }
  input[type=text] { width: 8rem; }
  input[type=range] { width: 18rem; accent-color: #ff6a00; height: 2rem; }
  .drag { min-width: 16rem; }
  .drag b { color: #ff6a00; font-size: 1.1rem; }
  button { background: #120c08; color: #f3ead2; border: 1px solid #ff6a00;
           padding: 0.5rem 0.9rem; cursor: pointer; font: 700 13px/1 Futura, sans-serif;
           letter-spacing: 0.14em; }
  button.shoot { background: #d4000d; border-color: #ff2a2a; color: #fff; font-size: 1.05rem;
                 padding: 0.7rem 1.4rem; letter-spacing: 0.22em; margin-left: auto; }
  .dlchk { display: flex; flex-direction: row; align-items: center; gap: 0.4rem;
           color: #8a7a55; font-size: 0.75rem; letter-spacing: 0.12em;
           text-transform: uppercase; margin-left: auto; }
  .dlchk input { accent-color: #ff6a00; width: 1.1rem; height: 1.1rem; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: end; margin-top: 0.7rem; }
  label { display: flex; flex-direction: column; gap: 0.2rem; color: #8a7a55; font-size: 0.75rem;
          letter-spacing: 0.12em; text-transform: uppercase; }
  #log { white-space: pre-wrap; color: #6cff4d; font: 13px ui-monospace, Menlo, monospace; min-height: 3rem; }
  #log.err { color: #ff3b3b; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 0 0 1rem; }
  #pairs { display: grid; gap: 0.6rem; margin-top: 0.8rem; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
          width: 100%; text-align: left; padding: 0.5rem; }
  .pair img { width: 100%; aspect-ratio: 3/2; object-fit: cover; background: #000; }
  .pair span { grid-column: 1 / -1; color: #8a7a55; font-size: 0.8rem; }
  .pair.on { background: #3a1600; color: #ff6a00; }
  .pano-out img { width: 100%; display: block; background: #000; margin-top: 0.8rem; }
  .tabs button { border-bottom: 3px solid transparent; background: #0c0c0d; }
  .tabs button.on { border-bottom-color: #ff6a00; color: #ff6a00; }
  .pane[hidden] { display: none !important; }
</style>
<div class="nerv">NERV</div>
<h1>MAGI · LAB</h1>
<p class="sub">第3新東京市 debugger · <a href="/">field 作戦</a> · T 初号機 · R 零号機 · USB skew tens of ms</p>
<div class="hazard"></div>
<nav class="tabs">
  <button type="button" class="on" data-tab="view">射撃 VIEW</button>
  <button type="button" data-tab="usb">USB</button>
  <button type="button" data-tab="pano">全景 PANO</button>
</nav>
<div id="tab-view" class="pane">
<section>
  <div class="previews">
    <figure>
      <figcaption>T · back · +Y</figcaption>
      <img id="lvT" alt="T live view">
    </figure>
    <figure>
      <figcaption>R · side · +X</figcaption>
      <img id="lvR" alt="R live view">
    </figure>
  </div>
  <div class="row">
    <button id="live">Live view</button>
    <button id="liveStop">Stop</button>
    <label class="dlchk"><input type="checkbox" id="dl">Download</label>
    <button class="shoot" id="shoot">Shoot to cards</button>
  </div>
  <div class="row">
    <label class="drag">ISO <b id="isoVal">400</b>
      <input type="range" id="isoDrag" min="0" step="1">
    </label>
    <label class="drag">Shutter <b id="shutVal">1/125</b>
      <input type="range" id="shutDrag" min="0" step="1">
    </label>
    <label>Program
      <select id="program">
        <option>M</option><option>A</option><option>S</option><option>P</option>
      </select>
    </label>
    <label>WB
      <select id="wb">
        <option>Auto</option><option>Sunny</option><option>Cloudy</option>
        <option>Flash</option><option>Tungsten</option><option>Fluorescent</option>
        <option>Shade</option>
      </select>
    </label>
    <label>Quality
      <select id="quality">
        <option>JPEG Fine</option><option>JPEG Normal</option>
        <option>NEF+Fine</option><option value="NEF (Raw)">NEF (Raw)</option>
      </select>
    </label>
    <button id="set">Set both</button>
  </div>
</section>
</div>
<div id="tab-usb" class="pane" hidden>
<section>
  <table id="cams"><thead><tr>
    <th>role</th><th>serial</th><th>port</th><th>model</th>
  </tr></thead><tbody></tbody></table>
  <div class="row">
    <button id="detect">Detect</button>
    <button id="status">Status</button>
  </div>
</section>
<section>
  <div class="row">
    <label>T serial<input id="t" placeholder="back / +Y"></label>
    <label>R serial<input id="r" placeholder="side / +X"></label>
    <button id="pair">Pair</button>
  </div>
</section>
</div>
<div id="tab-pano" class="pane" hidden>
<section>
  <div class="row">
    <button id="panoRefresh">List pairs</button>
    <button id="panoGo">Stitch</button>
    <label class="dlchk"><input type="checkbox" id="flipR" checked>Flip R</label>
    <label>Overlap
      <input type="range" id="olDrag" min="5" max="45" value="20" step="1">
    </label>
    <b id="olVal">20%</b>
  </div>
  <div id="pairs"></div>
  <div class="pano-out"><img id="panoOut" alt=""></div>
</section>
</div>
<pre id="log">Lab: type serials, inspect status, MJPEG optional. Field UI is / for the phone.</pre>
<script>
const ISO = ["100","125","160","200","250","320","400","500","640","800","1000","1250",
  "1600","2000","2500","3200","4000","5000","6400","12800","25600"];
const SHUT = ["30","20","15","10","8","6","4","3","2","1.6","1.3","1","0.8","0.6","0.5",
  "1/3","1/4","1/5","1/6","1/8","1/10","1/13","1/15","1/20","1/25","1/30","1/40","1/50",
  "1/60","1/80","1/100","1/125","1/160","1/200","1/250","1/320","1/400","1/500","1/640",
  "1/800","1/1000","1/1250","1/1600","1/2000","1/2500","1/3200","1/4000","1/5000","1/6400","1/8000"];
const bindDrag = (id, list, label, start) => {
  const el = document.getElementById(id);
  el.max = String(list.length - 1);
  const paint = () => {
    document.getElementById(label).textContent = list[parseInt(el.value, 10) || 0];
  };
  el.addEventListener("input", paint);
  const i = list.indexOf(start);
  el.value = String(i < 0 ? 0 : i);
  paint();
};
const log = (m, err) => { const el = document.getElementById("log");
  el.textContent = m; el.className = err ? "err" : ""; };
const api = async (path, opt) => {
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const fill = (rows) => {
  const tb = document.querySelector("#cams tbody");
  tb.innerHTML = "";
  (rows || []).forEach(row => {
    const tr = document.createElement("tr");
    ["role","serial","port","model"].forEach(k => {
      const td = document.createElement("td");
      td.textContent = row[k] || "—";
      tr.appendChild(td);
    });
    tb.appendChild(tr);
    if (row.role === "T" && row.serial) t.value = row.serial;
    if (row.role === "R" && row.serial) r.value = row.serial;
  });
  if (!(rows || []).length) {
    const tr = document.createElement("tr");
    tr.innerHTML = '<td colspan="4">no cameras on USB</td>';
    tb.appendChild(tr);
  }
};
const bind = (id, fn) => document.getElementById(id).onclick = async () => {
  document.getElementById(id).disabled = true;
  try { await fn(); } catch (e) { log(e.message, true); }
  document.getElementById(id).disabled = false;
};
const liveSrc = (on) => {
  ["T","R"].forEach(role => {
    document.getElementById("lv"+role).src = on ? "/api/live/"+role+".mjpg?"+Date.now() : "";
  });
};
bind("detect", async () => { liveSrc(false); const j = await api("/api/detect"); fill(j.cameras); log(j.message); });
bind("status", async () => { liveSrc(false); const j = await api("/api/status"); fill(j.cameras); log(j.message); });
bind("pair", async () => {
  const j = await api("/api/pair", { method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ t: t.value, r: r.value }) });
  log(j.message);
});
bind("set", async () => {
  liveSrc(false);
  const j = await api("/api/set", { method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ iso: isoVal.textContent, shutter: shutVal.textContent,
      program: program.value, wb: wb.value, quality: quality.value }) });
  log(j.message);
});
const paintShoot = () => {
  document.getElementById("shoot").textContent =
    document.getElementById("dl").checked ? "Shoot + download" : "Shoot to cards";
};
document.getElementById("dl").onchange = paintShoot;
bind("shoot", async () => {
  liveSrc(false);
  const target = document.getElementById("dl").checked ? "download" : "card";
  const j = await api("/api/shoot", { method:"POST",
    headers:{"content-type":"application/json"}, body: JSON.stringify({ target }) });
  log(j.message);
});
bind("live", async () => {
  const j = await api("/api/live/start", { method:"POST" }); liveSrc(true); log(j.message);
});
bind("liveStop", async () => { liveSrc(false); const j = await api("/api/live/stop", { method:"POST" }); log(j.message); });
let stamp = "";
const loadPairs = async () => {
  const j = await api("/api/captures");
  const box = document.getElementById("pairs");
  box.innerHTML = "";
  (j.pairs || []).forEach(p => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pair" + (p.stamp === stamp ? " on" : "");
    b.dataset.stamp = p.stamp;
    b.disabled = !p.ready;
    const t = p.t ? `<img alt="T" src="/api/file/${encodeURIComponent(p.t)}?w=320">` : "<span>T —</span>";
    const r = p.r ? `<img alt="R" src="/api/file/${encodeURIComponent(p.r)}?w=320">` : "<span>R —</span>";
    b.innerHTML = t + r + `<span>${p.stamp}${p.pano ? " · stitched" : ""}</span>`;
    b.onclick = () => {
      stamp = p.stamp;
      box.querySelectorAll(".pair").forEach(el => el.classList.toggle("on", el.dataset.stamp === p.stamp));
      if (p.pano) document.getElementById("panoOut").src = "/api/file/"+encodeURIComponent(p.pano)+"?"+Date.now();
    };
    box.appendChild(b);
  });
  if (!(j.pairs || []).length) {
    box.innerHTML = "<p class='sub'>No JPEG pairs. Shoot + download first.</p>";
  }
  log(j.message);
};
document.getElementById("olDrag").oninput = () => {
  document.getElementById("olVal").textContent = document.getElementById("olDrag").value + "%";
};
bind("panoRefresh", loadPairs);
bind("panoGo", async () => {
  if (!stamp) throw new Error("select a T/R pair");
  const j = await api("/api/pano", { method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ stamp, overlap: parseInt(olDrag.value, 10) / 100,
      flip_r: document.getElementById("flipR").checked }) });
  document.getElementById("panoOut").src = j.url + "?" + Date.now();
  log(j.message);
  await loadPairs();
});
const showTab = (name) => {
  document.querySelectorAll(".tabs [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  document.getElementById("tab-view").hidden = name !== "view";
  document.getElementById("tab-usb").hidden = name !== "usb";
  document.getElementById("tab-pano").hidden = name !== "pano";
  if (name === "pano") loadPairs().catch(e => log(e.message, true));
};
document.querySelectorAll(".tabs [data-tab]").forEach(b => { b.onclick = () => showTab(b.dataset.tab); });
showTab(location.hash === "#usb" ? "usb" : location.hash === "#pano" ? "pano" : "view");
bindDrag("isoDrag", ISO, "isoVal", "400");
bindDrag("shutDrag", SHUT, "shutVal", "1/125");
api("/api/detect").then(j => { fill(j.cameras); log(j.message); }).catch(e => log(e.message, true));
</script>
