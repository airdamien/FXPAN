<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <rect width="920" height="520" fill="#1c1b19"/>
  <text x="36" y="42" fill="#f2efe6" font-family="ui-sans-serif, sans-serif" font-size="22">Mini D1 to the trigger board</text>
  <text x="36" y="68" fill="#a39e93" font-family="ui-sans-serif, sans-serif" font-size="14">Three wires. The 330 ohm resistors are already on the board. Do not tie this ground to a TRS sleeve.</text>

  <rect x="48" y="110" width="250" height="340" rx="12" fill="#2a2825" stroke="#6d675e"/>
  <text x="72" y="146" fill="#f2efe6" font-family="ui-sans-serif, sans-serif" font-size="18">Mini D1 ESP32</text>
  <text x="72" y="172" fill="#a39e93" font-family="ui-sans-serif, sans-serif" font-size="13">USB powers the board</text>

  <g font-family="ui-monospace, monospace" font-size="14">
    <circle cx="86" cy="230" r="7" fill="#e0b15a"/>
    <text x="108" y="235" fill="#f2efe6">GPIO 32  focus</text>
    <circle cx="86" cy="290" r="7" fill="#d46a6a"/>
    <text x="108" y="295" fill="#f2efe6">GPIO 27  shutter</text>
    <circle cx="86" cy="350" r="7" fill="#8fd0c6"/>
    <text x="108" y="355" fill="#f2efe6">GND</text>
    <text x="108" y="410" fill="#6d675e">5 V pin stays open</text>
  </g>

  <rect x="560" y="110" width="320" height="340" rx="12" fill="#2a2825" stroke="#6d675e"/>
  <text x="584" y="146" fill="#f2efe6" font-family="ui-sans-serif, sans-serif" font-size="18">Trigger board socket</text>
  <text x="584" y="172" fill="#a39e93" font-family="ui-sans-serif, sans-serif" font-size="13">Pi pin numbers. Square pad is pin 1.</text>

  <g font-family="ui-monospace, monospace" font-size="14">
    <circle cx="598" cy="230" r="7" fill="#e0b15a"/>
    <text x="620" y="235" fill="#f2efe6">pin 38  focus</text>
    <circle cx="598" cy="290" r="7" fill="#d46a6a"/>
    <text x="620" y="295" fill="#f2efe6">pin 40  shutter</text>
    <circle cx="598" cy="350" r="7" fill="#8fd0c6"/>
    <text x="620" y="355" fill="#f2efe6">pin 39  GND</text>
    <text x="620" y="410" fill="#6d675e">pins 35 and 37 unused</text>
  </g>

  <path d="M93 230 H598" stroke="#e0b15a" stroke-width="3" fill="none"/>
  <path d="M93 290 H598" stroke="#d46a6a" stroke-width="3" fill="none"/>
  <path d="M93 350 H598" stroke="#8fd0c6" stroke-width="3" fill="none"/>
</svg>
