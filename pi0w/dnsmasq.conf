# DHCP for the iPad on the USB gadget only. DNS is off.
# No router and no DNS server. A gateway here makes the iPad send every
# packet, including Wi-Fi, at this board.
interface=usb0
bind-interfaces
port=0
dhcp-range=10.55.0.10,10.55.0.20,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
listen-address=10.55.0.1
except-interface=lo
except-interface=wlan0
no-resolv
no-hosts
